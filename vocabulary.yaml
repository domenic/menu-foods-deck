# The deck's house style: the words cards may use and how they are checked.
# build_deck.py reads this file alongside menu-foods.yaml; see the README's
# "Writing cards" and "What the build checks" sections for how it's used.

# Card categories. Each has the label shown on its cards' backs, the label for
# its concept cards, and the `jargon` groups (below) that its cards are checked
# against. A category may also define a profile, and rules for its headlines.
#
# A profile's rows are listed in display order. Each row has a label shown on
# the card and a shape:
#   text:   free text
#   single: one word
#   range:  one word, or a list of two for a range ("soft to semi-soft")
#   list:   a list of words, shown separated by `joiner`
#   stages: words separated by " or ", then optional details after a comma
#           ("young or aged, 1 month to 2 years")
# `words` lists the words a row may use. A word naming a card links that card,
# which is glossed on the back; a word with no card after it is plain English.
# Rows marked `required` must appear in every profile, unless the card has
# narrower kinds that fill them in.
categories:
  pasta:
    label: Pasta
    term_label: Pasta term
    jargon: [pasta]
    # A pasta's profile, in display order: what kind of pasta it is and how it
    # looks, what it's made of and how, what it's served with, then where it's
    # from.
    profile:
      family:
        label: family
        shape: single
        required: true
        words:
          long strands: long pasta
          ribbons: ribbon pasta
          tubes: tube pasta
          short shapes: short pasta
          stuffed: stuffed pasta
          soup pasta: soup pasta
          dumplings: dumpling
          sheets:
      size:
        label: size
        shape: range
        words:
          tiny:
          small:
          medium:
          large:
          very large:
      surface:
        label: surface
        shape: list
        joiner: ", "
        words:
          smooth:
          ridged: ridged pasta
          hollow:
          twisted:
          ruffled:
          rough:
      dough:
        label: dough
        shape: list
        joiner: " or "
        required: true
        words:
          durum wheat: durum wheat
          egg: egg pasta
          potato:
          buckwheat:
          whole wheat:
          breadcrumbs, cheese and egg:
          plain flour:
      made:
        label: made
        shape: list
        joiner: ", "
        required: true
        words:
          dried: dried pasta
          fresh: fresh pasta
          by hand: handmade pasta
      sauce:
        label: served
        shape: list
        joiner: ", "
        words:
          in meat sauce: ragù
          in tomato sauce:
          in creamy sauces:
          with butter:
          with olive oil and garlic: aglio e olio
          with pesto: pesto
          with seafood:
          with vegetables:
          with cheese:
          in broth:
          baked:
      origin:
        label: from
        shape: text
        required: true
  meat:
    label: Meat & charcuterie
    term_label: Meat term
    jargon: [meat]
    # A meat card's headline starts with its profile's animal row.
    headline_lead: animal
    # A meat's profile, in display order: what kind of meat it is and where on
    # which animal it comes from, how it's prepared and served, what it's like
    # to eat, then where it's from.
    profile:
      family:
        label: family
        shape: single
        words:
          ham: ham
          cured cut: cured cut
          salami: salame
          fresh sausage: fresh sausage
          cooked sausage: cooked sausage
          blood sausage: blood sausage
          meat spread: meat spread
          steak: steak
          offal: offal
      animal:
        label: animal
        shape: list
        joiner: " or "
        required: true
        words:
          pig:
          cow:
          young cow:
          sheep:
          young sheep:
          goat:
          young goat:
          deer:
          wild boar:
          duck:
          goose:
          rabbit:
          guinea fowl:
          chicken:
          various animals:
      part:
        label: part
        shape: list
        joiner: ", "
        words:
          leg: leg (meat)
          belly: belly (meat)
          jowl: jowl
          neck: neck (meat)
          shoulder: shoulder (meat)
          loin: loin
          tenderloin: tenderloin
          rib: rib (meat)
          flank: flank (meat)
          shank: shank
          trotter: trotter
          back fat: back fat
          bone marrow: bone marrow
          blood:
          chest:
          diaphragm:
          hip:
          liver:
          skin:
          stomach:
          intestines:
          glands:
          various parts:
      made:
        label: made
        shape: list
        joiner: ", "
        required: true
        words:
          raw:
          cured: cured meat
          dry-cured: dry-cured meat
          smoked: smoked meat
          cooked:
          roasted:
          braised: braised meat
          slow-cooked in fat: confit
          dry-aged: dry-aged beef
      served:
        label: served
        shape: list
        joiner: ", "
        words:
          thinly sliced:
          sliced:
          spread on bread:
          grilled:
          pan-fried:
          fried:
          simmered:
          cooked in dishes:
          crumbled into dishes:
          in sandwiches:
          scooped onto toast:
      texture:
        label: texture
        shape: list
        joiner: ", "
        words:
          tender:
          firm:
          chewy:
          soft:
          silky:
          chunky:
          smooth:
          spreadable:
          creamy:
      fat:
        label: fat
        shape: list
        joiner: ", "
        words:
          lean:
          fatty:
          marbled: marbled meat
      strength:
        label: strength
        shape: range
        words:
          mild:
          medium:
          strong:
      flavor:
        label: flavor
        shape: list
        joiner: ", "
        words:
          salty:
          sweet:
          spicy:
          smoky:
          peppery:
          garlicky:
          herby:
          fennel-flavored:
          paprika-flavored:
          gamey: gamey meat
          beefy:
          tangy:
      cured for:
        label: cured for
        shape: text
      origin:
        label: from
        shape: text
        required: true
      label:
        label: label
        shape: stages
        words:
          DOP: DOP
          AOP: AOP
          PDO: PDO
          IGP: IGP
          PGI: PGI
  cheese:
    label: Cheese
    term_label: Cheese term
    jargon: [cheese]
    # A cheese's profile, in display order: what kind of cheese it is, what
    # it's like to eat, what it's made from and how, then where it's from.
    profile:
      family:
        label: family
        shape: single
        words:
          stretched-curd: stretched-curd cheese
          whey cheese: whey cheese
          brined: brined cheese
          processed: processed cheese
          blue: blue cheese
          Alpine-style: Alpine-style cheese
          grana: grana
      rind:
        label: rind
        shape: single
        required: true
        words:
          none:
          natural: natural rind
          bloomy: bloomy rind
          washed: washed rind
          wax: wax rind
      firmness:
        label: firmness
        shape: range
        required: true
        words:
          soft: soft cheese
          semi-soft: semi-soft cheese
          firm: firm cheese
          hard: hard cheese
      texture:
        label: texture
        shape: list
        joiner: ", "
        words:
          big holes:
          creamy:
          crumbly:
          doesn’t melt:
          grainy:
          high in fat:
          lumpy:
          melts well: melting cheese
          moist:
          small holes:
          springy: springy cheese
          spreadable:
          stringy:
      strength:
        label: strength
        shape: range
        required: true
        words:
          mild:
          medium:
          strong:
      flavor:
        label: flavor
        shape: list
        joiner: ", "
        words:
          buttery:
          caramel-like:
          earthy: earthy cheese
          milky:
          nutty: nutty cheese
          salty:
          sharp: sharp cheese
          slightly sweet:
          smoky:
          spicy:
          tangy: tangy cheese
      smell:
        label: smell
        shape: single
        words:
          pungent: pungent cheese
      milk:
        label: milk
        shape: list
        joiner: " or "
        required: true
        words:
          cow:
          sheep:
          goat:
          water buffalo:
      age:
        label: age
        shape: stages
        required: true
        words:
          fresh: fresh cheese
          young: young cheese
          aged: aged cheese
      style:
        label: style
        shape: list
        joiner: " or "
        words:
          dolce: dolce (cheese)
          piccante: piccante (cheese)
      made:
        label: made
        shape: list
        joiner: ", "
        words:
          pressed: pressed cheese
          from whey: whey
          ash-coated: ash (cheese)
          with an ash line: ash (cheese)
          cave-aged: cave-aged cheese
          often smoked: smoked cheese
      origin:
        label: from
        shape: text
        required: true
      label:
        label: label
        shape: stages
        words:
          DOP: DOP
          AOP: AOP
          PDO: PDO
    # The kinds of adjective that may come before "cheese" in a headline, in the
    # order they must appear. `*` matches any word, as in "pear-shaped".
    headline_noun: cheese
    headline_order:
      - kind: size, shape or color
        words: [small, large, big, round, square, flat, "*-shaped", orange, white]
      - kind: firmness
        words: [soft, semi-soft, firm, hard]
      - kind: texture
        words: [creamy, crumbly, grainy, granular, stringy, springy, spreadable, lumpy, moist, smooth, high-fat]
      - kind: flavor
        words: [mild, medium, strong, sharp, pungent, tangy, nutty, earthy, buttery, salty, milky, sweet, smoky, spicy,
                strong-smelling]
      - kind: age
        words: [fresh, young, aged, cave-aged]
      - kind: origin
        words: [Italian, French, Swiss, Spanish, Greek, Mexican, Dutch, Danish, English, Cypriot, American]
      - kind: kind
        words: [bloomy-rind, washed-rind, stretched-curd, blue, brined, whey, processed, Alpine-style, grating, melting,
                cream, triple-cream, "*’s-milk", "*'s-milk"]
  seafood:
    label: Seafood
    term_label: Seafood term
    jargon: [cheese]
  vegetable:
    label: Vegetable
    term_label: Vegetable term
    jargon: [cheese]
  condiment:
    label: Condiment
    term_label: Condiment term
    jargon: [cheese]
  dessert:
    label: Dessert
    term_label: Dessert term
    jargon: [cheese]
  dish:
    label: Dish
    term_label: Dish term
    jargon: [cheese, meat, pasta]
  other:
    label: Other menu trap
    term_label: Menu term
    jargon: [cheese]

# Terms of art, grouped by the kind of food they belong to, each with the card
# explaining it and the word forms that count as using it. A card may use one
# only if it builds on that card, directly or through its prerequisites. Each
# category above says which groups apply to it, so "young" can mean young cheese
# on a cheese card and something else on a meat card. (Every card's own term is
# also checked, as written, on every card.)
jargon:
  cheese:
    Alpine-style cheese: [Alpine]
    ash (cheese): [ash]
    aged cheese: [aged, aging, ages, ripe, ripened, ripens, ripening]
    bloomy rind: [bloomy]
    blue cheese: [blue cheese, blue cheeses]
    brined cheese: [brine, brined]
    cave-aged cheese: [cave-aged]
    curds: [curd, curds]
    earthy cheese: [earthy]
    fresh cheese: [fresh cheese, fresh cheeses]
    grana: [grana]
    melting cheese: [melting cheese, melting cheeses]
    mold (cheese): [mold]
    nutty cheese: [nutty]
    pressed cheese: [pressed]
    processed cheese: [processed]
    pungent cheese: [pungent]
    rind: [rind, rinds]
    semi-soft cheese: [semi-soft]
    firm cheese: [semi-hard, semi-firm]
    sharp cheese: [sharp]
    springy cheese: [springy]
    stretched-curd cheese: [stretched-curd]
    tangy cheese: [tangy]
    triple crème: [triple crème, triple creme, triple-crème, triple-creme]
    washed rind: [washed]
    wheel (cheese): [wedge, wedges, wheel, wheels]
    whey: [whey]
    young cheese: [young]
  meat:
    cured meat: [cured, curing]
    dry-cured meat: [dry-cured]
    smoked meat: [smoked]
    braised meat: [braised, braising]
    confit: [confit]
    offal: [offal]
    charcuterie: [charcuterie]
    marbled meat: [marbled, marbling]
    gamey meat: [gamey]
    dry-aged beef: [dry-aged]
  pasta:
    durum wheat: [durum, semolina]
    egg pasta: [egg pasta]
    fresh pasta: [fresh pasta]
    dried pasta: [dried pasta]
    handmade pasta: [handmade, hand-rolled, hand-shaped, hand-twisted]
    ridged pasta: [ridged]
    al dente: [al dente]
    stuffed pasta: [stuffed pasta]
    dumpling: [dumpling, dumplings]

# Vague words with no card, which reworked cards may not use at all.
banned: [farmhouse, mountain cheese, mountain cheeses, rustic]
