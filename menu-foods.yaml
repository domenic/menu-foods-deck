    details: >-
      The newer, EU-wide version of France’s [[AOC]] label.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Geographical_indications_and_traditional_specialities_in_the_European_Union
  - term: AOC
    category: cheese
    kind: concept
    translates: protected designation of origin
    answer:
      core:
        - '[[protected designation of origin]]'
      context:
        - French abbreviation of the older national label (appellation d’origine contrôlée)
    details: >-
      France’s original national label, also used for wines.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Geographical_indications_and_traditional_specialities_in_the_European_Union
  - term: melting cheese
    category: cheese
    kind: concept
    answer:
      core:
        - melts smooth and gooey
    details: >-
      The cheeses for fondue, grilled cheese, pizza and burgers. American cheese is the extreme example, and pepper jack melts
      well too. Other cheeses soften but don’t melt: they stay in shape when heated, or separate into grease and lumps.
    compare:
      - fondue
      - American cheese
      - pepper jack
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese
    image: A delicious, freshly baked paneer pizza with an incredible cheese pull.jpg
  - term: soft cheese
    category: cheese
    kind: concept
    answer:
      core:
        - soft enough to spread, scoop or ooze
    details: >-
      Soft cheeses have lots of moisture: think cream cheese, or an older brie oozing when cut. Most are eaten [[young cheese|young]].
    compare:
      - brie
      - cream cheese
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese#Soft_cheese
    image: VacherinInside (8323389420).jpg
  - term: semi-soft cheese
    category: cheese
    kind: concept
    answer:
      core:
        - slices easily, but bends
    details: >-
      Moist, smooth and a little [[springy cheese|springy]]; often melts well. American cheese, string cheese and pepper jack
      are all semi-soft.
    compare:
      - American cheese
      - string cheese
      - pepper jack
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese#Semi-soft_cheese
    image: DeutschButterkäse.jpg
  - term: firm cheese
    category: cheese
    kind: concept
    answer:
      core:
        - slices cleanly; breaks rather than bends
    details: >-
      Also called “semi-hard” or “semi-firm”. Cheddar is the classic example. Most firm cheeses are [[pressed cheese|pressed]]
      and [[aged cheese|aged]] for months.
    compare:
      - cheddar
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese#Semi-hard_cheese
    image: Somerset-Cheddar.jpg
  - term: hard cheese
    category: cheese
    kind: concept
    answer:
      core:
        - dry and hard enough to grate
    details: >-
      Hard cheeses are [[aged cheese|aged]] a long time, often a year or more, until much of their moisture is gone. They
      are usually grated or shaved over food, like shaker parmesan, or broken into chunks.
    compare:
      - parmesan
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese#Hard_cheese
    image: Fine Microplane Grating Hard Cheese.jpg
  - term: cheese firmness
    id: cheese firmness ladder
    category: cheese
    kind: concept
    answer:
      core:
        - soft → semi-soft → firm → hard
    details: >-
      [[soft cheese|Soft]]: spreads or oozes (cream cheese). [[semi-soft cheese|Semi-soft]]: slices but bends (American, string
      cheese). [[firm cheese|Firm]]: slices cleanly and breaks (cheddar). [[hard cheese|Hard]]: grates (shaker parmesan).
      Firmness is mostly about moisture, so a cheese gets firmer the longer it [[aged cheese|ages]].
    compare:
      - cream cheese
      - string cheese
      - cheddar
      - parmesan
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese#Moisture:_soft_to_hard
  - term: sharp cheese
    category: cheese
    kind: concept
    answer:
      core:
        - a [[tangy cheese|tangy]] taste that tingles on your tongue and grows as a cheese [[aged cheese|ages]]
    details: >-
      The difference between mild and sharp cheddar. It’s a kind of strong flavor, felt most at the sides of your tongue.
    compare:
      - cheddar
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese
  - term: pungent cheese
    category: cheese
    kind: concept
    answer:
      core:
        - strong-smelling; stinky
    details: >-
      Pungent cheeses can smell like feet, a barnyard or cooked cabbage. It’s a kind of strong flavor, but one you smell rather
      than taste: many pungent cheeses taste much milder than they smell.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pungency
  - term: tangy cheese
    category: cheese
    kind: concept
    answer:
      core:
        - pleasantly sour, like yogurt or cream cheese
    details: >-
      A mild sourness, like sour cream or buttermilk. Common in [[young cheese|young]] cheeses and in goat’s-milk cheeses.
    compare:
      - cream cheese
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese
  - term: nutty cheese
    category: cheese
    kind: concept
    answer:
      core:
        - toasty, like roasted nuts
    details: >-
      A toasty, slightly sweet flavor that develops as [[firm cheese|firm cheeses]] [[aged cheese|age]]. Parmesan has some
      of it. It’s the classic flavor of cheeses like gruyère.
    compare:
      - gruyère
      - parmesan
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese
  - term: earthy cheese
    category: cheese
    kind: concept
    answer:
      core:
        - tasting and smelling like mushrooms or damp soil
    details: >-
      Usually comes from what grows on the outside of the cheese, so it’s strongest near the [[rind]].
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese
  - term: springy cheese
    category: cheese
    kind: concept
    answer:
      core:
        - bounces back when you press or bite it
      context:
        - like string cheese
    details: >-
      A rubbery, elastic give: squeeze it and it pushes back, then returns to its shape. Common in [[young cheese|young]],
      moist cheeses like mozzarella, and in halloumi, which also squeaks against your teeth.
    compare:
      - mozzarella
      - halloumi
      - string cheese
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese
  - term: cheese flavor strength
    id: cheese flavor strength ladder
    category: cheese
    kind: concept
    answer:
      core:
        - mild → medium → strong
      context:
        - strong can mean [[sharp cheese|sharp]] (a taste) or [[pungent cheese|pungent]] (a smell)
    details: >-
      Mild: milky and gentle, like American or string cheese. Medium: clearly flavorful, like a medium cheddar. Strong comes
      in two separate kinds, and a cheese can have either or both: sharp is a strong, biting taste, like extra-sharp cheddar;
      pungent is a strong smell. Many pungent cheeses taste only mild or medium, which is why cards list smell separately
      from strength. Flavor generally gets stronger as a cheese [[aged cheese|ages]].
    compare:
      - string cheese
      - cheddar
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese
  - term: stretched-curd cheese
    category: cheese
    kind: concept
    answer:
      core:
        - '[[curds]] heated and stretched like taffy, making it stringy and [[springy cheese|springy]]'
    details: >-
      The curds are dipped in hot water, then pulled, stretched and folded until smooth and elastic. That’s why string cheese
      peels into strings and why mozzarella stretches on pizza.
    compare:
      - mozzarella
      - string cheese
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/List_of_stretch-curd_cheeses
