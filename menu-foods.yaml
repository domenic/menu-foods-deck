      Confit (French pronunciation: [kɔ̃fi]; Occitan: Confisat) (from the French word confire, literally
      'to preserve') is any type of food that is cooked slowly over a long period as a method of preservation.
      Confit, as a cooking term, describes the process of cooking food in fat, whether it be grease or
      oil, at a lower temperature compared to deep frying.
