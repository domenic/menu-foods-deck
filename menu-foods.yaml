  - term: ris de veau
    category: meat
    answer:
      core:
        - young cow
        - sweetbreads
      context:
        - French
        - despite the name, not rice
    details: >-
      Sweetbread is a culinary name for the thymus or pancreas, typically from calf or lamb. Sweetbreads
      have a rich, slightly gamey flavour and a tender, succulent texture.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Sweetbread
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1367036244
    image: Ris de Veau.jpg
  - term: foie gras
    category: meat
    answer:
      core:
        - duck or goose
        - fatty liver
    details: >-
      Foie gras (lit. 'fat liver'; French: [fwa ɡʁɑ]; Occitan: foiè grass) is a specialty food product
      made of the liver of a duck or goose. According to French law, foie gras is defined as the liver
      of a duck or goose fattened by gavage (force feeding).
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Foie_gras
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1368764317
    image: Foie_gras_en_cocotte.jpg
  - term: curds
    category: cheese
    kind: concept
    answer:
      core:
        - the soft white solids that milk separates into when making cheese
    details: >-
      Cheesemaking starts by souring milk or adding rennet, a natural substance that makes milk set, which makes it separate
      into soft white clumps (the curds) and a thin, watery liquid that is drained away. Nearly every cheese is made by salting,
      shaping and often [[aged cheese|aging]] these curds. Eaten as-is, fresh curds are mild and squeak against your teeth.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Curd
    image: Draining Curds.jpg
  - term: whey
    category: cheese
    kind: concept
    answer:
      core:
        - the thin, watery liquid left over when milk separates into [[curds]]
    details: >-
      Most cheesemaking drains the whey away and keeps the curds. It's slightly sweet and cloudy yellow-green. It still has
      some protein, which is why a few cheeses, like ricotta, are made by reheating it, and why it's sold dried as whey protein
      powder.
    compare:
      - ricotta
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Whey
    image: Joehrerhof Schafkaeseproduktion Abschoepfen der Molke 13062014 754.jpg
  - term: whey cheese
    category: cheese
    kind: concept
    answer:
      core:
        - made by reheating leftover [[whey]] instead of from [[curds]]
    details: >-
      Heating the whey makes its remaining protein clump into tiny, soft, grainy curds, which are scooped out. The result
      is mild, moist and slightly sweet. Ricotta, Italian for “re-cooked”, is the best-known one.
    compare:
      - ricotta
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Whey_cheese
    image: Schiumatura del siero per la produzione della ricotta.jpg
  - term: pressed cheese
    category: cheese
    kind: concept
    answer:
      core:
        - '[[curds]] squeezed under weights to force out liquid'
    details: >-
      Pressing drives more liquid out of the curds than draining alone, packing them into a dense, solid block. So pressed
      cheeses end up firmer and keep longer. Cheddar and parmesan are both pressed.
    compare:
      - cheddar
      - parmesan
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Cheese_press
    image: Gruyere making-IMG 5349.JPG
  - term: aged cheese
    category: cheese
    kind: concept
    answer:
      core:
        - stored for weeks to years before eating, to develop flavor
    details: >-
      Also called “ripened” or “matured”. While a cheese is stored in a cool, damp room, moisture slowly evaporates and bacteria
      and [[mold (cheese)|mold]] slowly break it down. So the longer a cheese ages, the firmer, drier and stronger-tasting
      it usually gets: cheddar aged a couple of months is mild and bendy, while cheddar aged over a year is crumbly and bites
      back.
    compare:
      - cheddar
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Cheese_ripening
    image: Obere Bundalp BE Käsekeller 01.jpg
  - term: fresh cheese
    category: cheese
    kind: concept
    answer:
      core:
        - eaten within days of being made, without [[aged cheese|aging]]
    details: >-
      Fresh cheeses are soft, moist, mild and milky, often a little [[tangy cheese|tangy]], and have no [[rind]]. Cream cheese
      is one. They spoil quickly, so they are often sold in tubs or sitting in liquid.
    compare:
      - cream cheese
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese#Fresh_and_whey_cheeses
    image: Cheese 55 bg 061806.jpg
  - term: wheel (cheese)
    category: cheese
    kind: concept
    answer:
      core:
        - a whole cheese in the flat, round shape it was made in
    details: >-
      Cheeses are shaped in containers, and most come out as flat rounds, from palm-sized to over 40 kg (90 lb). Shops and
      restaurants cut big ones into wedges: triangular pieces running from the center to the edge.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Truckle
    image: Cut wheels of cheese (Unsplash).jpg
  - term: mold (cheese)
    category: cheese
    kind: concept
    answer:
      core:
        - harmless mold grown on purpose, for flavor and texture
    details: >-
      Cheesemakers add particular molds that are safe to eat. Some grow as a white, fuzzy coat on the outside of a cheese;
      others grow as blue-green streaks inside. Unexpected spots of other colors still mean a cheese has gone bad.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese#Mold
    image: Homemade Stilton Blue Cheese in UK.jpg
  - term: rind
    category: cheese
    kind: concept
    answer:
      core:
        - the outer layer or skin that forms on a cheese as it [[aged cheese|ages]]
    details: >-
      Like a crust on bread, it's drier and tougher than the inside. Some form on their own as the outside dries out; others
      are grown on purpose from [[mold (cheese)|mold]], or by rubbing the cheese with salt water; some cheeses are sealed
      in wax instead. Thin, soft rinds are usually eaten; hard crusts and wax are not. Cheeses eaten within days of being
      made have none.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Rind
    image: WikiCheese - Tomme de Savoie - 20150619 - 002.jpg
  - term: natural rind
    category: cheese
    kind: concept
    answer:
      core:
        - a dry, hard [[rind]] that forms on its own as a cheese’s outside dries out
    details: >-
      The most common kind of rind, usually brownish, grayish or tan. Cheesemakers may brush, oil or turn the cheese while
      it [[aged cheese|ages]], but they don't grow anything on it. Found mostly on [[firm cheese|firm]] and [[hard cheese|hard]]
      cheeses, like parmesan's crust, and usually too hard to eat.
    compare:
      - parmesan
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese#Hard_cheese
    image_from: tomme
  - term: bloomy rind
    category: cheese
    kind: concept
    answer:
      core:
        - a thin, white, fuzzy [[rind]] of edible [[mold (cheese)|mold]]
    details: >-
      The white mold is sprayed on and grows over a few weeks like velvet (it “blooms”). As it grows, it softens the cheese
      from the outside in and gives it buttery, [[earthy cheese|earthy]], mushroomy flavors. Found almost only on [[soft cheese|soft
      cheeses]]; also called “soft-ripened”. The rind is meant to be eaten.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Bloomy_rind
    image: Wikicheese - Coulommiers - 20150515 - 020.jpg
  - term: washed rind
    category: cheese
    kind: concept
    answer:
      core:
        - an orange, sticky [[rind]] made by repeatedly washing the cheese with salt water
    details: >-
      The washing encourages particular bacteria, related to the ones living on human skin, which is why these cheeses can
      smell like feet. They are famously [[pungent cheese|pungent]], but usually taste much milder than they smell: salty
      and buttery. Some are washed with beer, wine or brandy instead.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Washed-rind_cheese
    image: Époisses Gaugry 06.jpg
  - term: wax rind
    category: cheese
    kind: concept
    answer:
      core:
        - a coating of wax sealed around a cheese to protect it; not eaten
    details: >-
      Instead of letting a [[rind]] form, some cheeses are dipped in wax, often red, yellow or black, which keeps them moist
      as they [[aged cheese|age]]. Peel it off before eating.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese
    image: SmallEdamCheese.jpg
  - term: ash (cheese)
    category: cheese
    kind: concept
    answer:
      core:
        - fine, edible charcoal powder dusted on or through a cheese
    details: >-
      Made from burned plants. It started as a way to protect the outside of a cheese; today it helps [[mold (cheese)|mold]]
      grow evenly and looks striking: a gray-black coat, or a thin line through the middle. It has almost no taste. Common
      on French goat cheeses.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese#Surface_mold-ripened_(white)
    image: Selles-sur-cher 1.jpg
  - term: cave-aged cheese
    category: cheese
    kind: concept
    answer:
      core:
        - '[[aged cheese|aged]] in a cool, damp cave or cellar'
    details: >-
      Caves stay cool and humid all year, which keeps cheeses from drying out and helps their [[rind|rinds]] develop. Some
      famous cheeses must be aged in particular caves, like roquefort; elsewhere the phrase is mostly marketing for aging
      in a cellar.
    compare:
      - roquefort
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Cheese_ripening
    image: Cheeses stored at Wookey Hole Caves.JPG
  - term: brined cheese
    category: cheese
    kind: concept
    answer:
      core:
        - stored in salt water, which keeps it moist and salty
    details: >-
      Brine is just very salty water. Brined cheeses sit in it until they're sold, so they have no [[rind]] and taste noticeably
      salty. Feta and halloumi are the best-known. (Many other cheeses get a short brine bath just to salt them, but aren't
      called brined cheeses.)
    compare:
      - feta
      - halloumi
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Brined_cheese
    image: Nabulsi cheese sold in brine.jpg
  - term: protected designation of origin
    category: cheese
    kind: concept
    answer:
      core:
        - 'a legal label: made in its traditional home region by traditional rules'
    details: >-
      Only cheese made in a particular region, following its traditional rules, may use a protected name. So shaker parmesan
      made in the US isn't parmigiano reggiano. Each language abbreviates the label differently.
    compare:
      - parmigiano reggiano
      - parmesan
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Geographical_indications_and_traditional_specialities_in_the_European_Union
    image: Parmigiano Reggiano DOP Billa.jpg
  - term: PDO
    category: cheese
    kind: concept
    translates: protected designation of origin
    answer:
      core:
        - '[[protected designation of origin]]'
      context:
        - English abbreviation
    details: >-
      The EU-wide label, as written in English.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Geographical_indications_and_traditional_specialities_in_the_European_Union
  - term: DOP
    category: cheese
    kind: concept
    translates: protected designation of origin
    answer:
      core:
        - '[[protected designation of origin]]'
      context:
        - Italian and Spanish abbreviation (denominazione di origine protetta; denominación de origen protegida)
    details: >-
      Common on Italian menus, as in parmigiano reggiano DOP.
    compare:
      - parmigiano reggiano
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Geographical_indications_and_traditional_specialities_in_the_European_Union
  - term: AOP
    category: cheese
    kind: concept
    translates: protected designation of origin
    answer:
      core:
        - '[[protected designation of origin]]'
      context:
        - French abbreviation (appellation d’origine protégée)
    details: >-
      The newer, EU-wide version of France's [[AOC]] label.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Geographical_indications_and_traditional_specialities_in_the_European_Union
  - term: AOC
    category: cheese
    kind: concept
    translates: protected designation of origin
    answer:
      core:
        - '[[protected designation of origin]]'
      context:
        - French abbreviation of the older national label (appellation d’origine contrôlée)
    details: >-
      France's original national label, also used for wines.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Geographical_indications_and_traditional_specialities_in_the_European_Union
  - term: melting cheese
    category: cheese
    kind: concept
    answer:
      core:
        - melts smooth and gooey
    details: >-
      The cheeses for fondue, grilled cheese, pizza and burgers. American cheese is the extreme example, and pepper jack melts
      well too. Other cheeses soften but don't melt: they stay in shape when heated, or separate into grease and lumps.
    compare:
      - fondue
      - American cheese
      - pepper jack
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese
    image: A delicious, freshly baked paneer pizza with an incredible cheese pull.jpg
  - term: soft cheese
    category: cheese
    kind: concept
    answer:
      core:
        - soft enough to spread, scoop or ooze
    details: >-
      Soft cheeses have lots of moisture: think cream cheese, or an older brie oozing when cut. Most are eaten [[young cheese|young]].
    compare:
      - brie
      - cream cheese
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese#Soft_cheese
    image: VacherinInside (8323389420).jpg
  - term: semi-soft cheese
    category: cheese
    kind: concept
    answer:
      core:
        - slices easily, but bends
    details: >-
      Moist, smooth and a little [[springy cheese|springy]]; often melts well. American cheese, string cheese and pepper jack
      are all semi-soft.
    compare:
      - American cheese
      - string cheese
      - pepper jack
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese#Semi-soft_cheese
    image: DeutschButterkäse.jpg
  - term: firm cheese
    category: cheese
    kind: concept
    answer:
      core:
        - slices cleanly; breaks rather than bends
    details: >-
      Also called “semi-hard” or “semi-firm”. Cheddar is the classic example. Most firm cheeses are [[pressed cheese|pressed]]
      and [[aged cheese|aged]] for months.
    compare:
      - cheddar
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese#Semi-hard_cheese
    image: Somerset-Cheddar.jpg
  - term: hard cheese
    category: cheese
    kind: concept
    answer:
      core:
        - dry and hard enough to grate
    details: >-
      Hard cheeses are [[aged cheese|aged]] a long time, often a year or more, until much of their moisture is gone. They
      are usually grated or shaved over food, like shaker parmesan, or broken into chunks.
    compare:
      - parmesan
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese#Hard_cheese
    image: Fine Microplane Grating Hard Cheese.jpg
  - term: cheese firmness
    id: cheese firmness ladder
    category: cheese
    kind: concept
    answer:
      core:
        - soft → semi-soft → firm → hard
    details: >-
      [[soft cheese|Soft]]: spreads or oozes (cream cheese). [[semi-soft cheese|Semi-soft]]: slices but bends (American, string
      cheese). [[firm cheese|Firm]]: slices cleanly and breaks (cheddar). [[hard cheese|Hard]]: grates (shaker parmesan).
      Firmness is mostly about moisture, so a cheese gets firmer the longer it [[aged cheese|ages]].
    compare:
      - cream cheese
      - string cheese
      - cheddar
      - parmesan
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese#Moisture:_soft_to_hard
  - term: sharp cheese
    category: cheese
    kind: concept
    answer:
      core:
        - a [[tangy cheese|tangy]] taste that tingles on your tongue and grows as a cheese [[aged cheese|ages]]
    details: >-
      The difference between mild and sharp cheddar. It's a kind of strong flavor, felt most at the sides of your tongue.
    compare:
      - cheddar
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese
  - term: pungent cheese
    category: cheese
    kind: concept
    answer:
      core:
        - strong-smelling; stinky
    details: >-
      Pungent cheeses can smell like feet, a barnyard or cooked cabbage. It's a kind of strong flavor, but one you smell rather
      than taste: many pungent cheeses taste much milder than they smell.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pungency
  - term: tangy cheese
    category: cheese
    kind: concept
    answer:
      core:
        - pleasantly sour, like yogurt or cream cheese
    details: >-
      A mild sourness, like sour cream or buttermilk. Common in [[young cheese|young]] cheeses and in goat's-milk cheeses.
    compare:
      - cream cheese
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese
  - term: nutty cheese
    category: cheese
    kind: concept
    answer:
      core:
        - toasty, like roasted nuts
    details: >-
      A toasty, slightly sweet flavor that develops as [[firm cheese|firm cheeses]] [[aged cheese|age]]. Parmesan has some
      of it. It's the classic flavor of cheeses like gruyère.
    compare:
      - gruyère
      - parmesan
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese
  - term: earthy cheese
    category: cheese
    kind: concept
    answer:
      core:
        - tasting and smelling like mushrooms or damp soil
    details: >-
      Usually comes from what grows on the outside of the cheese, so it's strongest near the [[rind]].
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese
  - term: springy cheese
    category: cheese
    kind: concept
    answer:
      core:
        - bounces back when you press or bite it, like string cheese
    details: >-
      A rubbery, elastic give: squeeze it and it pushes back, then returns to its shape. Common in [[young cheese|young]],
      moist cheeses like mozzarella, and in halloumi, which also squeaks against your teeth.
    compare:
      - mozzarella
      - halloumi
      - string cheese
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese
  - term: cheese flavor strength
    id: cheese flavor strength ladder
    category: cheese
    kind: concept
    answer:
      core:
        - mild → medium → strong
      context:
        - strong can mean [[sharp cheese|sharp]] (a taste) or [[pungent cheese|pungent]] (a smell)
    details: >-
      Mild: milky and gentle, like American or string cheese. Medium: clearly flavorful, like a medium cheddar. Strong comes
      in two separate kinds, and a cheese can have either or both: sharp is a strong, biting taste, like extra-sharp cheddar;
      pungent is a strong smell. Many pungent cheeses taste only mild or medium, which is why cards list smell separately
      from strength. Flavor generally gets stronger as a cheese [[aged cheese|ages]].
    compare:
      - string cheese
      - cheddar
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Types_of_cheese
  - term: stretched-curd cheese
    category: cheese
    kind: concept
    answer:
      core:
        - '[[curds]] heated and stretched like taffy, making it stringy and [[springy cheese|springy]]'
    details: >-
      The curds are dipped in hot water, then pulled, stretched and folded until smooth and elastic. That's why string cheese
      peels into strings and why mozzarella stretches on pizza.
    compare:
      - mozzarella
      - string cheese
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/List_of_stretch-curd_cheeses
    image: Mozzatura mozzarella.jpg
  - term: blue cheese
    category: cheese
    kind: concept
    answer:
      core:
        - streaks of blue-green [[mold (cheese)|mold]] grown inside
    details: >-
      The cheese is pierced with needles so air can reach the mold inside. Blue cheeses are [[tangy cheese|tangy]], salty
      and strong, often [[pungent cheese|pungent]], and either creamy or crumbly. Blue cheese dressing is made from them.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Blue_cheese
    image: Bleu de Gex.jpg
  - term: Alpine-style cheese
    category: cheese
    kind: concept
    answer:
      core:
        - big, [[firm cheese|firm]] [[wheel (cheese)|wheels]] of [[nutty cheese|nutty]] cow’s-milk cheese that melt well
    details: >-
      Made in and around the Alps, the mountains of Switzerland, France and Italy, from the milk of cows grazing high pastures.
      The [[curds]] are heated, [[pressed cheese|pressed]] into wheels of up to 40 kg (90 lb), then [[aged cheese|aged]] for
      months to years. They melt smoothly, which is why fondue uses them. Gruyère is the best-known, and French speakers once
      called the whole family “gruyère”. Not every cheese from the Alps is in this style.
    compare:
      - gruyère
      - fondue
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Swiss-type_cheeses
    image: Affinage Gruyère (landscape).jpg
  - term: grana
    category: cheese
    kind: concept
    answer:
      core:
        - hard, grainy Italian cheese [[aged cheese|aged]] a year or more, for grating
    details: >-
      Grana means “grain”: the texture is grainy and dotted with tiny crunchy crystals. Made in huge [[wheel (cheese)|wheels]]
      and protected by [[DOP]] labels. Shaker parmesan is a US imitation.
    compare:
      - parmesan
    source:
      label: Wikipedia
