cards:
  - term: acini di pepe
    category: pasta
    answer:
      core:
        - tiny bead-shaped pasta
    details: >-
      Acini di pepe (Italian: [ˈaːtʃini di ˈpeːpe]; lit. 'seeds of pepper') is a type of pasta. Acini
      is the plural of acino whose root is the Latin word acinus.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Acini_di_pepe
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1324910850
    image: Acini_di_Pepe.jpg
  - term: agnolotti
    category: pasta
    answer:
      core:
        - small stuffed pasta parcels
    details: >-
      Agnolotti (Italian: [aɲɲoˈlɔtti]; Piedmontese: agnolòt, Piedmontese: [aɲʊˈlɔt]), also known as agnolotti
      piemontesi, is a type of stuffed pasta typical of the Piedmont region of Italy, made with small
      pieces of flattened dough folded over a filling of roasted meat or vegetables. Agnolotti can be
      di magro or di grasso depending on their filling of vegetables or meat.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Agnolotti
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1357274030
    image: Agnolotti.JPG
  - term: anelli
    category: pasta
    answer:
      core:
        - small ring-shaped pasta
    details: >-
      Anelli (also known as anellini or anelletti) are small, thin rings of pasta. They are generally
      used for soups and pasta salads.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Anelli
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1281191531
    image: Uncooked_anellini_pasta.jpg
  - term: bigoli
    category: pasta
    answer:
      core:
        - thick, rough spaghetti-like pasta
    details: >-
      Bigoli (Italian: [ˈbiːɡoli]; Venetian: bìgołi) is an extruded pasta in the form of a long and thick
      strand. Initially bigoli were made with buckwheat flour, but are now more commonly made with whole-wheat
      flour, and sometimes include duck eggs.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Bigoli
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1322505674
    image: Bigoli2.jpg
  - term: bucatini
    category: pasta
    answer:
      core:
        - thick spaghetti with a hollow center
    details: >-
      Bucatini (Italian: [bukaˈtiːni]), also known as perciatelli (Italian: [pertʃaˈtɛlli]), is a thick
      spaghetti-like pasta with a hole running through the center. It is common throughout Lazio, particularly
      Rome.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Bucatini
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1368524370
    image: Bucatini.jpg
  - term: busiate
    category: pasta
    answer:
      core:
        - long, tightly twisted pasta
      context:
        - Sicilian
    details: >-
      Busiate or busiati are a type of long macaroni, originating in the province of Trapani and typical
      of the Calabria and Sicily regions of Italy. They take their name from busa, the Sicilian word for
      the stem of Ampelodesmos mauritanicus, a local grass, which is used in preparing them and giving
      them their helical shape.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Busiate
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1368524534
    image: Busiate.jpg
  - term: calamarata
    category: pasta
    answer:
      core:
        - thick squid-ring-shaped pasta
    details: >-
      Calamarata is a type of thick ring pasta, often dyed with black squid ink to resemble sliced calamari.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Calamarata
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1346179978
    image: Calamari2.jpg
  - term: campanelle
    category: pasta
    answer:
      core:
        - ruffled cone or bell-shaped pasta
    details: >-
      Campanelle (Italian: [kampaˈnɛlle]; Italian for 'bellflowers' or 'little bells') is a type of pasta
      which is shaped like a cone with a ruffled edge, or a bell-like flower. It is also sometimes referred
      to as gigli ('lilies') or trompetti ('trumpets').
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Campanelle
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1295748189
    image: Gigli.jpg
  - term: cannelloni
    category: pasta
    answer:
      core:
        - large pasta tubes meant for stuffing
    details: >-
      Cannelloni (Italian: [kannelˈloːni]; Italian for 'large reeds') are a cylindrical type of egg-based
      stuffed pasta generally served baked with a filling and covered by a sauce in Italian cuisine. Popular
      stuffings include spinach and ricotta or minced beef.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Cannelloni
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1359658583
    image: Cannelloni2.png
  - term: capellini
    category: pasta
    answer:
      core:
        - very thin strands
        - angel-hair pasta
    details: >-
      Capellini (Italian: [kapelˈliːni]; lit. 'little hairs') is a thin variety of pasta, with a diameter
      ranging from 0.85 to 0.92 mm (0.033 to 0.036 in). It is made in the form of long, thin strands,
      similar to spaghetti.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Capellini
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1368524619
    image: Capelli_angelo_front.jpg
  - term: cappellacci
    category: pasta
    answer:
      core:
        - large hat-shaped stuffed pasta
    details: >-
      Cappellacci are large, hat-shaped stuffed egg-pasta parcels associated with Ferrara. The classic
      cappellacci di zucca are filled with pumpkin, Parmigiano Reggiano, breadcrumbs, and nutmeg, although
      menu fillings can vary.
    source:
      label: Ferrara tourism
      url: https://www.inferrara.it/en/p/12/food/i-cappellacci-di-zucca-igp
    image: Caplét ad suca.jpg
  - term: cappelletti
    category: pasta
    answer:
      core:
        - small hat-shaped stuffed pasta
    details: >-
      Cappelletti (Italian: [kappelˈletti]) are ring-shaped stuffed pasta; they are named for the characteristic
      shape that resembles a hat (cappello in Italian). Compared to tortellini, they have a different
      shape, larger size, thicker dough and different filling.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Cappelletti_(pasta)
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1307367080
    image: 02_Cappelletti_-_Cappellacci_-_Pasta_ripiena_-_Cucina_tipica_-_Ferrara.jpg
  - term: casarecce
    category: pasta
    answer:
      core:
        - short, loosely rolled S-shaped pasta
    details: >-
      Casarecce (from Italian casereccio, 'homemade') are short twists of pasta originating in the Sicily
      region of Italy which appear rolled up on themselves like a scroll. Casarecce pairs well with cream/cheese,
      meat, napolitana, seafood, pesto, and vegetables.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Casarecce
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1312453629
    image: Casarecce2.jpg
  - term: cavatappi
    category: pasta
    answer:
      core:
        - hollow corkscrew-shaped pasta
    details: >-
      Cavatappi (Italian: [kavaˈtappi]; lit. 'corkscrews'), also known as spirali, cellentani, amori,
      fusilli rigati, or curly mac, is macaroni formed in a helical tube shape. Certain areas of the US
      and Canada may also refer to it as "double elbows" or "scoobi doo" pasta, purportedly because of
      their resemblance to scoubidou.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Cavatappi
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1356065520
    image: Cellentani2.jpg
  - term: cavatelli
    category: pasta
    answer:
      core:
        - small folded pasta shells with a hollow
    details: >-
      Cavatelli are small pasta shells made from semolina or other flour dough, commonly cooked with garlic
      and broccoli or rapini, or simply with tomato sauce. A variant adds ricotta cheese to the dough
      mix.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Cavatelli
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1304509810
    image: Cavatelli.jpg
  - term: conchiglie
    category: pasta
    answer:
      core:
        - seashell-shaped pasta
    details: >-
      Conchiglie (Italian: [koŋˈkiʎʎe]) are a type of pasta. They are usually sold in the plain durum
      wheat variety, and also in colored varieties which use natural pigments, such as tomato extract,
      squid ink or spinach extract.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Conchiglie
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1368441381
    image: Conchiglie_rigate.png
  - term: corzetti
    category: pasta
    answer:
      core:
        - thin round pasta coins, often stamped
    details: >-
      Corzetti or croxetti (Ligurian: [kur'zetˑi] or [kru'ʒetˑi]) are a type of pasta typical of the Ligurian
      cuisine of northwest Italy, and also traditional in the area of Novi Ligure just across the border
      with Piedmont, in the province of Alessandria. Corzetti originated in Liguria, in northern Italy
      along the border with France, during the Middle Ages.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Corzetti
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1334573850
    image: Croxetti.png
  - term: ditalini
    category: pasta
    answer:
      core:
        - very short, tiny pasta tubes
    details: >-
      Ditalini (Italian: [ditaˈliːni]; English: "small thimbles"), also referred to as tubettini, is a
      type of pasta that is shaped like small tubes. It has been described as "thimble-sized" and as "very
      short macaroni".
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Ditalini
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1331179687
    image: Ditalini-230.jpg
  - term: farfalle
    category: pasta
    answer:
      core:
        - bow-tie or butterfly-shaped pasta
    details: >-
      Farfalle (Italian: [farˈfalle]) are a type of pasta. The name is derived from the Italian word farfalle
      ('butterflies').
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Farfalle
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1342296920
    image: Farfalle_Pasta.JPG
  - term: fettuccine
    category: pasta
    answer:
      core:
        - flat, medium-width pasta ribbons
    details: >-
      Fettuccine is a type of pasta popular in Roman cuisine. It is descended from the extremely thin
      capelli d'angelo of the Renaissance, but is a flat, thick pasta traditionally made with egg and
      flour (usually one egg for every 100 grams or 3.5 ounces of flour).
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Fettuccine
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1368523573
    image: Fettucine1.JPG
  - term: fileja
    category: pasta
    answer:
      core:
        - long, narrow corkscrews
      context:
        - Calabrian
    details: >-
      Fileja (pronounced [fɪˈlɛːja]) is a type of pasta typical from the province of Vibo Valentia, Calabria.
      Made of durum wheat semolina and water, they are prepared by wrapping a sheet of pasta around a
      thin cane (dinaciulu), creating a hollow tube approximately 20 cm in length.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Fileja
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1368524726
    image: Fileja.jpg
  - term: fregola
    category: pasta
    answer:
      core:
        - small toasted pasta balls
      context:
        - Sardinian
    details: >-
      Fregula (often written fregola) is a type of semolina pasta from the Sardinia region of Italy.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Fregula
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1366225076
    image: UncookedFregula.jpg
  - term: fusilli
    category: pasta
    answer:
      core:
        - short spiral or corkscrew pasta
    details: >-
      Fusilli (Italian: [fuˈzilli]) are a variety of pasta from southern Italy, with a helical (corkscrew)
      or helicoidal shape, also known as rotini in the United States and Canada.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Fusilli
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1362893270
    image: Fusilli pasta.jpg
  - term: garganelli
    category: pasta
    answer:
      core:
        - ridged pasta tubes with a visible seam
      context:
        - egg pasta
    details: >-
      Garganelli (Italian: [ɡarɡaˈnɛlli]; Romagnol: garganéi) are a type of egg-based pasta from the Emilia-Romagna
      region of Italy. They are formed by rolling a flat, square noodle into a cylindrical shape over
      a ridged wooden board, giving the pasta ridges.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Garganelli
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1297558206
    image: Garganelli_(10348149363).jpg
  - term: gemelli
    category: pasta
    answer:
      core:
        - short pasta twisted like paired strands
    details: >-
      Gemelli (Italian: [dʒeˈmɛlli]; lit. 'twins') are a type of pasta. They are most often used for making
      casserole or pasta salads.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Gemelli_(pasta)
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1297815596
    image: Gemelli.jpg
  - term: gnocchi
    category: pasta
    answer:
      core:
        - soft dumplings, usually made with potato
    details: >-
      Gnocchi are a varied family of pasta-like dumplings in Italian cuisine. They are made of small rolls
      of dough, such as those composed of a simple combination of wheat flour, potato, egg, and salt.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Gnocchi
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1365131052
    image: Gnocchi_di_ricotta_burro_e_salvia.jpg
  - term: lasagne
    category: pasta
    answer:
      core:
        - wide flat pasta sheets
        - also the layered dish
    details: >-
      Lasagna, also known by the plural form lasagne, is a type of pasta made in wide, flat sheets. It
      originates in Italian cuisine, where it is served in a number of ways, including in broth (lasagne
      in brodo), but is best known for its use in a baked dish made by stacking layers of pasta, alternating
      with fillings such as ragù (ground meats and tomato sauce), béchamel sauce, vegetables, cheeses
      (which may include ricotta, mozzarella, and Parmesan), and seasonings and spices.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Lasagna
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1364767829
    image: Lasagne_-_stonesoup.jpg
  - term: linguine
    category: pasta
    answer:
      core:
        - long, narrow, slightly flattened strands
    details: >-
      Linguine (lit. 'little tongues'), sometimes anglicized as linguini, is a type of pasta similar to
      fettuccine and trenette, distinguished by its elliptical rather than flat section. Around about
      4 millimetres (5⁄32 in) in width, it is wider than spaghetti, but less wide than fettuccine.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Linguine
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1368524870
    image: Linguine.jpg
  - term: lumache
    category: pasta
    answer:
      core:
        - curved, hollow snail-shell-shaped pasta
    details: >-
      Lumache (Italian for “snails”) are short, curved, hollow pasta pieces shaped like snail shells,
      often with ridges and one pinched end. Their hollow shape is well suited to catching thick or chunky
      sauces.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/List_of_pasta#Short-cut_extruded_pasta
    image: Lumache pasta.jpg
  - term: mafaldine
    category: pasta
    answer:
      core:
        - long ribbons with ruffled edges
    details: >-
      Mafaldine, also known as reginette (Italian for 'little queens') or simply mafalde, is a type of
      ribbon-shaped pasta.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Mafaldine
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1368524899
    image: Reginette.jpg
  - term: malloreddus
    category: pasta
    answer:
      core:
        - small ridged pasta shells
      context:
        - Sardinian
    details: >-
      Malloreddus, sometimes Italianized as gnocchetti sardi, are a type of pasta typical of Sardinian
      cuisine. They have the shape of thin ribbed shells, about 2 cm (0.79 in) long, and are made of semolina
      flour and water.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Malloreddus
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1354708725
    image: Sardo_Cucina,_Fitzrovia,_London_(5147126888).jpg
  - term: manicotti
    category: pasta
    answer:
      core:
        - large ridged pasta tubes meant for stuffing
    details: >-
      Manicotti (the plural form of the Italian word manicotto; < manica, 'sleeve', + the augmentative
      ending, -otto) are a type of pasta in Italian and Italian-American cuisine. They are large pasta
      tubes intended to be stuffed and baked.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Manicotti
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1366857109
    image: EMS-109321-Manicotti-rule..JPG
  - term: mezze maniche
    category: pasta
    answer:
      core:
        - short, wide ridged pasta tubes
    details: >-
      Mezze maniche are short, wide pasta tubes whose name means “half sleeves.” They are about half the
      length of rigatoni and are commonly ridged to catch thick sauces.
    source:
      label: De Cecco
      url: https://www.dececco.com/it_it/product/mezze-maniche-rigate-n-136/
    image: Mezze maniche2.jpg
  - term: orecchiette
    category: pasta
    answer:
      core:
        - small ear-shaped pasta
    details: >-
      Orecchiette is a pasta typical of the Apulia region of Italy. Their name comes from the Italian
      word for "ear," a reference to their shape.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Orecchiette
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1355490900
    image: Orecchiette_carbonara.jpg
  - term: orzo
    category: pasta
    answer:
      core:
        - rice-shaped pasta—not rice
    details: >-
      Orzo (Italian: [ˈɔrdzo]; lit. 'barley'; from Latin hordeum), also known in Italy as risoni (Italian:
      [riˈzoːni]; 'large [grains of] rice'), and popular in Greek cuisine as kritharaki (κριθαράκι), is
      a form of short-cut pasta shaped like a large grain of rice. Orzo is made from flour, often with
      semolina.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Orzo
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1349978538
    image: Orzo.jpg
  - term: paccheri
    category: pasta
    answer:
      core:
        - very large, wide pasta tubes
    details: >-
      Paccheri (Italian: [ˈpakkeri]) is a type of pasta in the shape of a very large tube, originating
      from the Campania region of Italy. They are generally smooth, but there is also a ribbed version,
      paccheri millerighe.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Paccheri
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1369338874
    image: Paccheri3.jpg
  - term: pappardelle
    category: pasta
    answer:
      core:
        - very broad, flat pasta ribbons
    details: >-
      Pappardelle (Italian: [papparˈdɛlle]; sing.: pappardella; from the Italian verb pappare, meaning
      'to gobble up') are large, very broad, flat pasta, similar to wide fettuccine, originating from
      the Tuscany region of Italy. The fresh types are two to three centimetres (3⁄4–1 inches) wide and
      may have fluted edges, while dried egg pappardelle have straight sides.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pappardelle
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1368524935
    image: Pappardelle.jpg
  - term: passatelli
    category: pasta
    answer:
      core:
        - soft breadcrumb-and-egg noodle-like strands
    details: >-
      Passatelli are a pasta formed of bread crumbs, eggs, grated Parmesan cheese, and in some regions
      lemon, and nutmeg; it is typically cooked in chicken broth. Typically, it is found mainly in Romagna,
      Pesaro and Urbino province (northern Marche), Ancona province (central Marche) and other regions
      of Italy, such as Umbria.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Passatelli
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1301978901
    image: Passatelli.jpg
  - term: pastina
    category: pasta
    answer:
      core:
        - any very small pasta
      context:
        - usually for soup
    details: >-
      Pastina (lit. 'little pasta') is a variety of pasta consisting of tiny pieces, typically of a round
      (irregular) shape with a diameter of about two millimetres (1⁄16 inch). It is the smallest type
      of pasta produced.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pastina
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1342056480
    image: Pasta_2006_4.jpg
  - term: penne
    category: pasta
    answer:
      core:
        - short diagonal-cut pasta tubes
    details: >-
      Penne (Italian: [ˈpenne]) are an extruded type of pasta in the shape of tubular pieces with ends
      cut at an angle. They are usually made from wheat flour.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Penne
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1363164303
    image: Pennelisce_closeup.png
  - term: pici
    category: pasta
    answer:
      core:
        - thick, hand-rolled spaghetti
      context:
        - Tuscan
    details: >-
      Pici (Italian: [ˈpiːtʃi], locally [ˈpiːʃi]) is thick, hand-rolled pasta, like fat spaghetti. It
      originates in the province of Siena, in Tuscany; in the Montalcino area it is also referred to as
      pinci (Italian: [ˈpintʃi]).
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pici
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1368525022
    image: Pici_con_albume.jpeg
  - term: pizzoccheri
    category: pasta
    answer:
      core:
        - short, flat buckwheat pasta ribbons
    details: >-
      Pizzoccheri (Italian: [pitˈtsɔkkeri]; Lombard: pizzòcher, pronounced [piˈtsɔker, -kar]) is a flat
      ribbon pasta, made with a blend of buckwheat flour and wheat flour. It is believed to have originated
      in Valtellina, a valley in the northern Italian region of Lombardy.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pizzoccheri
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1342296852
    image: Pizzoccheri.jpg
  - term: radiatori
    category: pasta
    answer:
      core:
        - short pasta shaped like little radiators
    details: >-
      Radiatori are small, squat pasta shapes that are said to resemble radiators. Although it is rumored
      that they were created in the 1960s by an industrial designer, their invention was actually between
      the First and Second World War.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Radiatori
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1337810536
    image: Radiatori.jpg
  - term: ravioli
    category: pasta
    answer:
      core:
        - filled pasta pillows
    details: >-
      Ravioli (Italian: [raviˈɔli]; sing.: raviolo, Italian: [raviˈɔlo]) are a type of stuffed pasta comprising
      a filling enveloped in thin pasta dough. Usually served in broth or with a sauce, they originated
      as a traditional food in Italian cuisine.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Ravioli
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1365501669
    image: Flickr_-_cyclonebill_-_Ravioli_med_skinke_og_asparges_i_mascarponecreme.jpg
  - term: rigatoni
    category: pasta
    answer:
      core:
        - large ridged pasta tubes with square-cut ends
    details: >-
      Rigatoni (Italian: [riɡaˈtoːni]) is a type of pasta. They are larger than penne and ziti, and sometimes
      slightly curved, but not as curved as elbow macaroni.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Rigatoni
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1332730180
    image: Rigatoni.jpg
  - term: rotelle
    category: pasta
    answer:
      core:
        - wagon-wheel-shaped pasta
    details: >-
      Rotelle is a type of pasta resembling wheels with spokes. They are similar to fiori.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Rotelle
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1363713011
    image: Rotelle2.jpg
  - term: rotini
    category: pasta
    answer:
      core:
        - short, tight corkscrew pasta
    details: >-
      Fusilli (Italian: [fuˈzilli]) are a variety of pasta from southern Italy, with a helical (corkscrew)
      or helicoidal shape, also known as rotini in the United States and Canada.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Fusilli
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1362893270
    image: Rotini.jpg
  - term: scialatielli
    category: pasta
    answer:
      core:
        - short, thick, flat ribbons
      context:
        - from Campania
    details: >-
      Scialatielli or scialatelli (Italian: [ʃalaˈt(j)ɛlli]), also known as sciliatielli or scivatieddi,
      is a short, thick pasta with a rectangular cross section and an irregular, slightly curved shape.
      It is typical of modern Campanian cuisine, having originated on the Amalfi Coast as a chef's specialty,
      but it has also spread to nearby areas such as Catanzaro, Calabria, and Potenza, Basilicata.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Scialatielli
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1337855553
    image: Scialatielli.jpg
  - term: spaghetti
    category: pasta
    answer:
      core:
        - long, thin round pasta strands
    details: >-
      Spaghetti (Italian: [spaˈɡetti] 'little strings' plural diminutive of spago 'string') is a long,
      thin, solid, cylindrical pasta. It serves as a staple food of Italian cuisine and is made of milled
      wheat and water, with the standard Italian version using durum-wheat semolina.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Spaghetti
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1369051674
    image: Spaghettoni.jpg
  - term: spaghettini
    category: pasta
    answer:
      core:
        - thin spaghetti strands
    details: >-
      Spaghettini are long, round pasta strands with a smaller diameter than standard spaghetti. Their
      thinness gives them a shorter cooking time and makes them well suited to lighter sauces.
    source:
      label: Barilla
      url: https://www.barilla.com/it-it/prodotti/pasta/i-classici/spaghettini
    image: Spaghettini Ai Gamberi.jpg
  - term: strozzapreti
    category: pasta
    answer:
      core:
        - short, hand-rolled twisted pasta
    details: >-
      Strozzapreti (Italian: [ˌstrɔttsaˈprɛːti]; lit. 'priest choker' or 'priest strangler') are hand-made
      pasta shape, similar to cavatelli, though longer. The name is also used for a baked cheese and vegetable
      dumpling, prepared in some regions of Italy.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Strozzapreti
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1354371511
    image: Strozzapreti_bulk.jpg
  - term: tagliatelle
    category: pasta
    answer:
      core:
        - long, flat pasta ribbons
      context:
        - egg pasta
    details: >-
      Tagliatelle (Italian: [taʎʎaˈtɛlle]; from the Italian word tagliare, meaning 'to cut') are a traditional
      type of pasta from the Italian regions of Emilia-Romagna and Marche. Individual pieces of tagliatelle
      are long, flat ribbons that are similar in shape to fettuccine and are traditionally about 6 mm
      (1⁄4 in) wide.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Tagliatelle
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1368524338
    image: Nests_of_tagliatelle_bolognesi.jpg
  - term: tagliolini
    category: pasta
    answer:
      core:
        - very narrow, flat pasta ribbons
      context:
        - egg pasta
    details: >-
      Tagliolini (Italian: [taʎʎoˈliːni]) is a type of ribbon pasta, long like spaghetti, roughly 2–3
      mm (3⁄32–1⁄8 in) wide, cut from a sheet of dough similar to tagliatelle, but thin like capellini.
      It is a traditional recipe in the Molise and Piedmont regions of Italy.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Tagliolini
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1368525310
    image: 2016_1129_Turin_Tajarin_al_Castelmagno.jpg
  - term: tonnarelli
    category: pasta
    answer:
      core:
        - thick square-cut spaghetti
    details: >-
      Spaghetti alla chitarra (Italian: [spaˈɡetti ˌalla kiˈtarra]), also known as maccheroni alla chitarra,
      is a variety of egg pasta typical of the Abruzzo region of Italy, with a square cross section about
      2–3 mm thick. Tonnarelli are a similar pasta from Lazio, used especially in the Roman cacio e pepe.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Spaghetti_alla_chitarra
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1368525149
    image: Spaghetti_alla_chitarra.jpg
  - term: tortellini
    category: pasta
    answer:
      core:
        - small ring-shaped stuffed pasta
    details: >-
      Tortellini is a type of stuffed pasta typical of the Italian cities of Bologna and Modena, in the
      Emilia-Romagna region. Traditionally it is stuffed with a mix of meat (pork loin, prosciutto, mortadella),
      Parmesan cheese, egg, and nutmeg and served in capon broth (in brodo di cappone).
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Tortellini
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1329384628
    image: Tortellini_Bolognesi.jpg
  - term: tortelloni
    category: pasta
    answer:
      core:
        - larger ring-shaped stuffed pasta
    details: >-
      Tortelloni is a type of stuffed pasta common in northern Italy, with a shape similar to tortellini,
      but larger and with a cheese-based filling. It is traditionally stuffed with ricotta, Parmesan,
      leafy herbs or vegetables such as parsley or spinach, egg, and nutmeg.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Tortelloni
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1365130828
    image: Tortelloni.jpg
  - term: trofie
    category: pasta
    answer:
      core:
        - short, thin, hand-twisted pasta
      context:
        - Ligurian
    details: >-
      Trofie (Italian: [ˈtrɔːfje]), less frequently troffie, strofie or stroffie, is a short, thin, twisted
      pasta from the Liguria region of Italy. These thin, twisted shapes are believed to have originated
      in Sori, a town in the province of Genoa.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Trofie
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1359234777
    image: Trofie_pasta_macro.jpg
  - term: vermicelli
    category: pasta
    answer:
      core:
        - long thin strands, usually thinner than spaghetti
    details: >-
      Vermicelli (Italian: [vermiˈtʃɛlli]) is a type of pasta that is round in section, similar to spaghetti.
      In English-speaking regions, it is usually thinner than spaghetti, while in Italy it is thicker.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Vermicelli
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1368525764
    image: Fideo_(coiled_vermicelli).JPG
  - term: ziti
    category: pasta
    answer:
      core:
        - long, smooth pasta tubes
    details: >-
      Ziti (Italian: [ˈdziːti]) or zite (Italian: [ˈdziːte]) is a shape of extruded pasta originating
      in the Italian region of Sicily. Factories make ziti out of durum wheat flour and water, forming
      long, narrow tubes.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Ziti
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1351237415
    image: Ziti_al_ragù.jpg
  - term: pork
    category: meat
    kind: concept
    answer:
      core:
        - meat from a pig
    details: >-
      Pigs are raised for meat almost everywhere; much of it is eaten salted, [[smoked meat|smoked]] or made into [[sausage|sausages]].
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pork
    image: Truie Landrace.jpg
  - term: beef
    category: meat
    kind: concept
    answer:
      core:
        - meat from a grown cow
    details: >-
      Roast beef and hamburgers are beef. Cows raised for meat are called beef cattle.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Beef
    image: Horned Hereford cow Nevada.jpg
  - term: veal
    category: meat
    kind: concept
    answer:
      core:
        - meat from a young cow (a calf)
    details: >-
      Paler, milder and more tender than [[beef]], because the calf is only a few months old.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Veal
    image: Hereford calf on Ufton Hill Farm - geograph.org.uk - 1570020.jpg
    mirror_image: true
  - term: lamb
    category: meat
    kind: concept
    answer:
      core:
        - meat from a young sheep
    details: >-
      Sheep under about a year old. Mild and tender; often roasted, or served as chops (small [[steak|steaks]] cut with a
      [[rib (meat)|rib]] or [[loin]] bone).
    compare:
      - mutton
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Lamb_and_mutton
    image: Sheep in a field in Alsager 02.jpg
  - term: mutton
    category: meat
    kind: concept
    answer:
      core:
        - meat from an adult sheep
    details: >-
      Tougher and stronger-tasting than [[lamb]]; common in British, Middle Eastern and South Asian cooking.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Lamb_and_mutton
    image: Lleyn sheep.jpg
  - term: kid (meat)
    category: meat
    kind: concept
    answer:
      core:
        - meat from a young goat
    details: >-
      Lean and mild, a little like [[lamb]]. Common in Italian, Greek, Middle Eastern and Caribbean cooking.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Goat_meat
    image: Baby goat Prašivá.jpg
  - term: gamey meat
    category: meat
    kind: concept
    answer:
      core:
        - a strong, wild, slightly iron-like flavor
    details: >-
      Typical of meat from animals that roam and forage, like deer and wild pigs, and of older animals.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Game_(hunting)
  - term: venison
    category: meat
    kind: concept
    answer:
      core:
        - meat from a deer
    details: >-
      Dark red, very lean and a little [[gamey meat|gamey]]. Usually served rare to medium, since it dries out easily.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Venison
    image: Red Deer Cervus Elaphus in Richmond Park 2023 02.jpg
  - term: wild boar
    category: meat
    kind: concept
    answer:
      core:
        - meat from a wild pig
    details: >-
      Darker, leaner and more [[gamey meat|gamey]] than [[pork]]; often slow-cooked into stews and pasta sauces in Italy.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Wild_boar
    image: Wild boar in San Rossore, Pisa, Italy.jpg
  - term: poultry
    category: meat
    kind: concept
    answer:
      core:
        - farmed birds, and their meat
    details: >-
      Chicken, turkey, duck and goose. Wild birds, like pheasant, count as [[game (meat)|game]] instead.
    compare:
      - game (meat)
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Poultry
    image: Rooster and Hen 03.jpg
  - term: game (meat)
    category: meat
    kind: concept
    answer:
      core:
        - meat from animals traditionally hunted, even if now farmed
    details: >-
      Like [[venison]], [[wild boar]], rabbit and wild birds such as pheasant. Usually leaner and more [[gamey meat|gamey]]
      than farm meat.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Game_(hunting)
    image: Common pheasant (Phasianus colchicus) male 2.jpg
  - term: offal
    category: meat
    kind: concept
    answer:
      core:
        - an animal’s organs and other inner parts, eaten as food
    details: >-
      Liver, kidneys, heart, tongue and more. Common in many cuisines; menus sometimes call them variety meats.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Offal
    image: Liver and Onions, Naxos Greek Restaurant, Thunder Bay (42214775140).jpg
  - term: steak
    category: meat
    kind: concept
    answer:
      core:
        - a thick slice of meat, quickly grilled or pan-fried
    details: >-
      Usually [[beef]], but tuna, [[pork]] and even cauliflower steaks exist. Beef steaks are named for the part of the cow
      they’re cut from; the most tender come from along the back.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Steak
    image: Steack sauce au madère.jpg
  - term: marbled meat
    category: meat
    kind: concept
    answer:
      core:
        - with thin streaks of fat running through the red meat
    details: >-
      The fat melts as the meat cooks, keeping it juicy and rich-tasting, so marbled [[steak|steaks]] cost more.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Marbled_meat
    image: T-bone-raw-MCB.jpg
  - term: dry-aged beef
    category: meat
    kind: concept
    answer:
      core:
        - '[[beef]] hung in a cold, dry room for weeks before cooking'
    details: >-
      Aging tenderizes the meat and concentrates its flavor, making it deeper and a little nutty. It’s costly, since the outside
      dries out and is trimmed away.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Beef_aging
    image: Dry-aged beef-01.jpg
  - term: braised meat
    category: meat
    kind: concept
    answer:
      core:
        - browned, then simmered slowly in a little liquid until tender
    details: >-
      Braising turns tough, cheap [[cut of meat|cuts]] soft enough to cut with a fork, as in pot roast or osso buco.
    compare:
      - osso buco
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Braising
    image: American pot roast.jpg
  - term: sausage
    category: meat
    kind: concept
    answer:
      core:
        - seasoned ground meat stuffed into a thin tube, or casing
    details: >-
      The casing is traditionally cleaned intestine, now sometimes man-made. Some sausages must be cooked before eating; others
      are already cooked, or dried to be eaten as is.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Sausage
    image: Assorted Sausages with Fries.jpg
  - term: meatball
    category: meat
    kind: concept
    answer:
      core:
        - a ball of seasoned ground meat, usually [[beef]] or [[pork]]
    details: >-
      Spaghetti with meatballs is Italian-American; in Italy they’re usually smaller and served on their own.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Meatball
    image: Spaghetti and meatballs 1.jpg
    compare:
      - spaghetti
  - term: cold cuts
    category: meat
    kind: concept
    answer:
      core:
        - cooked or [[cured meat|cured]] meats, sliced thin and served cold
    details: >-
      The meats in a deli sandwich or on a platter: [[ham]], turkey, [[salame|salami]], bologna and the like. Also called
      lunch meat.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Lunch_meat
    image: Deli Meat, Tomatoes and Pickles.jpg
    compare:
      - bologna
  - term: deli meat
    category: meat
    kind: concept
    answer:
      core:
        - cooked or cured meats, sliced thin to order for sandwiches
    details: >-
      Sold at a deli counter, where it’s sliced from a big loaf or [[cut of meat|cut]], like deli turkey (turkey breast cooked
      in a loaf). The same thing as [[cold cuts]].
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Lunch_meat
    image: Meat slicer.jpg
  - term: cured meat
    category: meat
    kind: concept
    answer:
      core:
        - meat preserved with salt, often with spices, so it keeps much longer
    details: >-
      Salt draws water out of the meat, so bacteria can’t grow. Some cured meats keep for months without a fridge; others
      still need one.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Curing_(food_preservation)
    image: Salado Jamon Bellota Guijuelo Salamanca BEHER Bernardo Hernandez.jpg
  - term: dry-cured meat
    category: meat
    kind: concept
    answer:
      core:
        - '[[cured meat|cured]], then hung to dry for months; eaten raw, sliced thin'
    details: >-
      The long drying firms the meat and deepens its flavor.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Curing_(food_preservation)
    image: Bodega Curado Jamon BEHER Bernardo Hernandez Guijuelo Salamanca.JPG
  - term: smoked meat
    category: meat
    kind: concept
    answer:
      core:
        - meat hung in wood smoke, for flavor and to help preserve it
    details: >-
      Smoke gives meat a brown outside and a campfire flavor. Many meats are [[cured meat|cured]] first and then smoked.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Smoking_(cooking)
    image: Prosciutto smokehouse.JPG
  - term: crudo (meat)
    category: meat
    kind: concept
    answer:
      core:
        - 'raw: [[cured meat|cured]] rather than cooked'
      context:
        - Italian
    details: >-
      Italian for raw. Prosciutto crudo is the raw, cured [[ham]], as opposed to cooked ham.
    compare:
      - prosciutto crudo
      - prosciutto
    source:
      label: Wiktionary
      url: https://en.wiktionary.org/wiki/crudo#Italian
  - term: cotto
    category: meat
    kind: concept
    answer:
      core:
        - cooked
      context:
        - Italian
    details: >-
      Italian, as in prosciutto cotto, cooked [[ham]].
    compare:
      - prosciutto cotto
      - prosciutto
    source:
      label: Wiktionary
      url: https://en.wiktionary.org/wiki/cotto#Italian
  - term: ham
    category: meat
    kind: concept
    answer:
      core:
        - "[[pork]] from a pig’s back [[leg (meat)|leg]], [[cured meat|cured]], then cooked or dried"
    details: >-
      Cooked ham is the pink, moist sandwich kind; dried ham, like prosciutto, is salted and dried for months and eaten raw
      in paper-thin slices.
    compare:
      - prosciutto
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Ham
    image: A Spanish Ham at The Verandah.jpg
  - term: bacon
    category: meat
    kind: concept
    answer:
      core:
        - '[[cured meat|cured]], usually [[smoked meat|smoked]] [[pork]], sliced and fried'
    details: >-
      American bacon is strips with bands of fat, from the [[belly (meat)|belly]]; British and Canadian bacon are leaner,
      from the back. Pancetta is Italian bacon, usually unsmoked.
    compare:
      - pancetta
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Bacon
    image: Crispy Oven Roasted Bacon (8461921033).jpg
  - term: cured cut
    category: meat
    kind: concept
    answer:
      core:
        - a whole piece of meat, [[dry-cured meat|dry-cured]] and sliced thin
    details: >-
      Unlike [[salame|salami]], it isn’t ground, so each slice shows one solid piece of muscle. Coppa, bresaola and lonza
      are cured cuts.
    compare:
      - coppa
      - bresaola
      - lonza
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Salumi
  - term: fresh sausage
    category: meat
    kind: concept
    answer:
      core:
        - raw [[sausage]] that must be cooked before eating
    details: >-
      Italian sausage and breakfast sausage (usually ground [[pork]] with sage) are fresh sausages; they’re grilled, fried,
      or crumbled into sauces.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Sausage
    image: Raw sausages.jpg
  - term: cooked sausage
    category: meat
    kind: concept
    answer:
      core:
        - "[[sausage]] cooked when it’s made, so it’s ready to eat"
    details: >-
      Hot dogs and bologna are cooked sausages. They’re served cold in slices, or just heated through.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Sausage
    image: Wiener Wuerstchen (fcm).jpg
    compare:
      - bologna
  - term: blood sausage
    category: meat
    kind: concept
    answer:
      core:
        - "[[sausage]] made with animal blood, so it’s nearly black"
    details: >-
      The blood is mixed with fat and a filler like oats, rice or onions. Soft, and a little iron-tasting.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Blood_sausage
    image: Morcilla-burgos 2.jpg
  - term: meat spread
    category: meat
    kind: concept
    answer:
      core:
        - finely ground or shredded meat, served cold on bread or in slices
    details: >-
      Pâté is smooth, rillettes are shredded, and a terrine is a chunky loaf served in slices.
    compare:
      - pâté
      - rillettes
      - terrine
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/P%C3%A2t%C3%A9
    image: Rillettes and toast.JPG
  - term: charcuterie
    category: meat
    kind: concept
    answer:
      core:
        - cured and prepared meats, especially [[pork]], served cold
    details: >-
      Also the board they’re served on: a charcuterie board is a platter of sliced [[cured meat|cured]] meats, [[sausage|sausages]]
      and pâtés, often with cheese, pickles and bread.
    compare:
      - pâté
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Charcuterie
    image: Charcuterie board - Massachusetts.jpg
  - term: cut of meat
    category: meat
    kind: concept
    answer:
      core:
        - a piece of meat as a butcher sells it, taken from one part of the animal
    details: >-
      A part is a region of the animal, like the [[loin]] or the [[belly (meat)|belly]]; a cut is a particular piece taken
      from it, like a [[pork]] chop or a strip steak. One part yields several cuts. Tough cuts come from hard-working muscles
      and need slow cooking.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Cut_of_meat
  - term: leg (meat)
    category: meat
    kind: concept
    answer:
      core:
        - 'the upper back leg: large and lean'
    details: >-
      Any animal’s. On a pig it’s cured or cooked whole; on a cow it’s called the round, a lean [[cut of meat|cut]] often
      roasted; leg of [[lamb]] is a classic roast.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Ham
    image: Schwein-Schinken.png
  - term: belly (meat)
