cards:
  - term: pasta
    category: pasta
    kind: concept
    answer:
      core:
        - Italian dough of wheat and water or egg, shaped and boiled
    details: >-
      There are hundreds of shapes, each with its own name, because each holds sauce differently. Most are Italian, though
      pasta is now made everywhere.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pasta
  - term: noodle
    category: pasta
    kind: concept
    answer:
      core:
        - a strip of boiled dough; the general word, for Asian and European kinds alike
    details: >-
      Italian noodles are called [[pasta]]; ramen, udon (thick Japanese wheat noodles) and rice noodles are Asian ones.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Noodle
  - term: durum wheat
    category: pasta
    kind: concept
    answer:
      core:
        - a hard wheat that makes firm, yellowish pasta; its gritty flour is semolina
    details: >-
      Dried Italian [[pasta]] is made of durum wheat semolina and water, and stays firm when cooked.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Durum
    image: Triticum durum sl18.jpg
  - term: fresh pasta
    category: pasta
    kind: concept
    answer:
      core:
        - cooked from soft, moist dough, without drying it first
    details: >-
      Softer and more tender than boxed [[pasta]], and it cooks in a couple of minutes. In northern Italy it’s usually made
      with eggs, and in the south, with flour and water.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pasta#Fresh_pasta
    image: Séchage des pâtes fraîches (16464743776).jpg
  - term: egg pasta
    category: pasta
    kind: concept
    answer:
      core:
        - '[[pasta]] dough made with eggs in place of most or all of the water: softer and yellower, with a mild egg taste'
    details: >-
      Classic Italian egg pasta is just flour and eggs, which supply all the moisture; some recipes add a splash of
      water. Most northern Italian [[fresh pasta]] is egg pasta, like tagliatelle and tortellini.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pasta#Fresh_pasta
    image: Cooking-cuisine-delicious-egg-327143.jpg
    compare:
      - tagliatelle
      - tortellini
  - term: dried pasta
    category: pasta
    kind: concept
    answer:
      core:
        - 'made to keep: dried hard and sold in boxes or bags'
    details: >-
      Most shapes you buy are dried: made of [[durum wheat]] and water, they stay firm and chewy when cooked. Italians see
      it as different from [[fresh pasta]], not worse.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pasta#Dried_pasta
    image: Campo de' Fiori street market 2016 - 02.jpg
  - term: handmade pasta
    category: pasta
    kind: concept
    answer:
      core:
        - '[[pasta]] shaped by hand, one piece at a time'
    details: >-
      Rougher and less even than machine-made pasta, which helps sauce cling. Many regional shapes, like orecchiette and pici,
      are traditionally handmade.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pasta
    image: Orecchiette Bari.jpg
    compare:
      - orecchiette
      - pici
  - term: ridged pasta
    category: pasta
    kind: concept
    answer:
      core:
        - with grooves on the outside, which help sauce cling
    details: >-
      Tubes and shells often come ridged or smooth.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pasta
    image: Conchiglioni rigati.jpg
  - term: al dente
    category: pasta
    kind: concept
    answer:
      core:
        - cooked until tender but still firm to the bite
      context:
        - Italian; literally “to the tooth”
    details: >-
      How Italians cook [[pasta]]: with a little resistance in the middle, never mushy.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Al_dente
  - term: pasta size endings
    id: pasta size endings
    category: pasta
    kind: concept
    headline_lines: true
    answer:
      core:
        - '-ini, -etti, -elli: smaller'
        - '-oni, -one: bigger'
        - 'mezze, mezzi: half'
    details: >-
      Italian names build on each other this way: spaghettini are thin spaghetti, tortelloni are big tortellini, and mezze
      maniche are “half sleeves”.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Italian_grammar#Diminutives
    compare:
      - mezze maniche
      - spaghetti
      - spaghettini
      - tortellini
      - tortelloni
  - term: long pasta
    category: pasta
    kind: concept
    answer:
      core:
        - long, round or square strands
      context:
        - like spaghetti
    details: >-
      Usually twirled around a fork. Thin strands suit light oil or tomato sauces; thick ones suit chunky meat sauces.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/List_of_pasta#Long_pasta
    image: Pasta 2006 1.jpg
    compare:
      - spaghetti
  - term: ribbon pasta
    category: pasta
    kind: concept
    answer:
      core:
        - long, flat strips
      context:
        - like tagliatelle
    details: >-
      Often [[egg pasta]]; wide ribbons suit chunky meat sauces.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/List_of_pasta#Ribbon-cut_pasta
    image: Comparison ribbon pasta.jpg
    compare:
      - tagliatelle
  - term: tube pasta
    category: pasta
    kind: concept
    answer:
      core:
        - hollow tubes
      context:
        - like penne
    details: >-
      Sauce gets inside the tubes; big ones are also stuffed and baked.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/List_of_pasta#Tubular_pasta
    image: -EMS-RigPenneMost-120648.JPG
    compare:
      - penne
  - term: short pasta
    category: pasta
    kind: concept
    answer:
      core:
        - small shaped pieces
      context:
        - like shells, twists and bows
    details: >-
      The nooks and ridges catch chunky sauces; also common in [[pasta]] salads.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/List_of_pasta#Short-cut_pasta
    image: Pasta Evolution (26750479006).jpg
  - term: stuffed pasta
    category: pasta
    kind: concept
    answer:
      core:
        - pasta pockets with a filling
      context:
        - like ravioli
    details: >-
      Usually [[fresh pasta|fresh]] [[egg pasta]] around meat, cheese or vegetables, served simply so the filling stands out.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/List_of_pasta#Stuffed_pasta
    image: Pates Diverses SIAL 2008 Cl J Weber08 (23456163433).jpg
    compare:
      - ravioli
  - term: soup pasta
    category: pasta
    kind: concept
    answer:
      core:
        - tiny shapes cooked in broth
    details: >-
      Stars, rings, beads and little tubes, cooked in soup or served to children.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/List_of_pasta#Pastina
    image: Pasta_2006_4.jpg
  - term: dumpling
    category: pasta
    kind: concept
    answer:
      core:
        - a soft lump of dough, boiled or steamed; some are filled
    details: >-
      Found almost everywhere: Chinese and Japanese dumplings wrap meat or vegetables in thin dough, Polish pierogi hold potato
      and cheese, and American chicken and dumplings has plain, fluffy ones. Italian dumplings, like gnocchi, are made from
      potato, bread or ricotta rather than plain [[pasta]] dough, and are served like pasta; a few, like passatelli, are pressed
      into strands.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Dumpling
    compare:
      - gnocchi
      - passatelli
      - ricotta
  - term: long pasta, thinnest to thickest
    id: long pasta ladder
    category: pasta
    kind: concept
    answer:
      core:
        - '[[capellini]] → [[spaghettini]] → [[spaghetti]] → [[bucatini]], [[pici]] and [[bigoli]]'
    details: >-
      Thin strands cook in minutes and suit light sauces; thick ones suit chunky meat sauces. Vermicelli is confusing: thinner
      than spaghetti in the US, thicker in Italy.
    compare:
      - vermicelli
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/List_of_pasta#Long_pasta
  - term: ribbon pasta, narrowest to widest
    id: ribbon pasta ladder
    category: pasta
    kind: concept
    answer:
      core:
        - '[[tagliolini]] → [[fettuccine]] and [[tagliatelle]] → [[pappardelle]]'
    details: >-
      Fettuccine and tagliatelle are nearly the same; the names come from different regions.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/List_of_pasta#Ribbon-cut_pasta
  - term: tube pasta, smallest to largest
    id: tube pasta ladder
    category: pasta
    kind: concept
    answer:
      core:
        - '[[ditalini]] → [[penne]] and [[ziti]] → [[rigatoni]] → [[paccheri]] → [[cannelloni]] and [[manicotti]]'
    details: >-
      The smallest go in soups; the largest are stuffed and baked.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/List_of_pasta#Tubular_pasta
