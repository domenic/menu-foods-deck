      fat), used in a wide variety of cuisines to flavor savory food and salads. In French cuisine, lardons
      are also used for larding, by threading them with a needle into meats that are to be braised or
      roasted.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Lardon
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1328720221
