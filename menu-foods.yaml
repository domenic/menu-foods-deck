  - term: terrine
    category: meat
    answer:
      core:
        - animal varies
        - coarse pâté or layered meat loaf
        - served cold
    details: >-
      A terrine (French pronunciation: [tɛ.ʁin]), in traditional French cuisine, is a loaf of forcemeat
      or aspic, similar to a pâté, that is cooked in a covered pottery mold (also called a terrine) in
      a bain-marie. Modern terrines do not necessarily contain meat or animal fat, but still contain meat-like
      textures and fat substitutes, such as mushrooms and pureed fruits or vegetables high in pectin.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Terrine_(food)
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1334563412
    image: Terrine_de_saumon_au_basilic.JPG
  - term: lardons
