      Rillettes (French: [ʁijɛt]) is a preservation method similar to confit in which meat is seasoned,
      submerged in fat, and cooked slowly over the course of four to ten hours. The meat is shredded and
      packed into sterile containers covered in fat.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Rillettes
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1363357118
    image: Rillettes.jpg
  - term: pâté
