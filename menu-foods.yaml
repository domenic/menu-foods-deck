      in a pastry case and called pâté en croute; in more recent times it is more usually cooked without
      pastry in a terrine, and called pâté en terrine or simply terrine.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/P%C3%A2t%C3%A9
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1350694988
