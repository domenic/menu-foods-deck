      core:
        - short, thick, flat ribbons
      context:
        - from Campania
    details: >-
      Scialatielli or scialatelli (Italian: [ʃalaˈt(j)ɛlli]), also known as sciliatielli or scivatieddi,
      is a short, thick pasta with a rectangular cross section and an irregular, slightly curved shape.
      It is typical of modern Campanian cuisine, having originated on the Amalfi Coast as a chef's specialty,
      but it has also spread to nearby areas such as Catanzaro, Calabria, and Potenza, Basilicata.
