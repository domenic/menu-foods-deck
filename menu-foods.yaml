  - term: asiago
    category: cheese
    answer:
      core:
        - springy and mild when [[young cheese|young]]; hard and sharp when aged
    profile:
      rind: natural
      firmness: [semi-soft, hard]
      texture: [springy, grainy]
      strength: [mild, strong]
      flavor: [milky, buttery, nutty, sharp]
      milk: [cow]
      age: young or aged, 1 month to 2 years
      made: [pressed]
      origin: northern Italy
      label: DOP
    details: >-
      Two styles share the name. Asiago [[fresco]] (also called pressato) is aged about a month: pale, springy and mild, with
      small holes. Asiago d’allevo is aged for months to years until firm to hard, nutty and sharp. In the US, “asiago” usually
      means an aged, grating kind.
