      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1354151599
    image: Carpaccio_with_cheese_in_Warsaw.jpg
  - term: osso buco
    category: meat
    answer:
      core:
        - young cow
        - cross-cut shank
        - braised with its marrow bone
    details: >-
      Ossobuco or osso buco (Italian: [ˌɔssoˈbuːko]; Milanese: òss bus [ˌɔz ˈbyːs]), also known as ossobuco
      alla milanese, is a specialty of Lombard cuisine of cross-cut veal shanks braised with vegetables,
      white wine, and broth. It is often garnished with gremolada and traditionally served with either
      risotto alla milanese or polenta, depending on the regional variation.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Ossobuco
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1325393708
    image: Ossobuco.jpg
  - term: braciola
    category: meat
    answer:
      core:
        - animal varies
        - rolled or grilled meat slice
      context:
        - Italian
        - meaning varies by region
    details: >-
      Braciola (Italian: [braˈtʃɔːla]; pl.: braciole, Italian: [braˈtʃɔːle]) may refer to several distinct
      dishes in Italian cuisine.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Braciola
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1332397386
    image: Braciola_di_maiale_e_melanzane_ai_ferri.jpg
  - term: animelle
    category: meat
    answer:
      core:
        - usually young cow or young sheep
        - sweetbreads (glands)
      context:
        - Italian
    details: >-
      Sweetbread is a culinary name for the thymus or pancreas, typically from calf or lamb. Sweetbreads
      have a rich, slightly gamey flavour and a tender, succulent texture.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Sweetbread
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1367036244
    image: SweetbreadsChufaCuminBroccoliCocoa_(8311452821).jpg
  - term: trippa
    category: meat
    answer:
      core:
        - animal varies
        - tripe
        - edible stomach lining
      context:
        - Italian
    details: >-
      Tripe is the digestive system of ruminants prepared as edible offal. Most tripe is from cattle and
      sheep, but may come from other ruminants as well.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Tripe
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1355101341
    image: Trippa.jpg
  - term: midollo
    category: meat
    answer:
      core:
        - animal varies
        - bone marrow
      context:
        - Italian
    details: >-
      Humans consume the bone marrow of animals as a food source. It is found in the long bones of animals
      and comes in two types: yellow and red marrow.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Bone_marrow_as_food
      adapted_from: https://en.wikipedia.org/w/index.php?oldid=1368972402
