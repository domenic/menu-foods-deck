      url: https://en.wikipedia.org/wiki/Beef
    image: Horned Hereford cow Nevada.jpg
  - term: veal
    category: meat
    kind: concept
    answer:
      core:
        - meat from a young cow (a calf)
    details: >-
      Paler, milder and more tender than [[beef]], because the calf is only a few months old.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Veal
    image: Hereford calf on Ufton Hill Farm - geograph.org.uk - 1570020.jpg
    mirror_image: true
  - term: lamb
    category: meat
    kind: concept
    answer:
      core:
        - meat from a young sheep
    details: >-
      Sheep under about a year old. Mild and tender; often roasted, or served as chops (small [[steak|steaks]] cut with a
      [[rib (meat)|rib]] or [[loin]] bone).
    compare:
      - mutton
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Lamb_and_mutton
    image: Sheep in a field in Alsager 02.jpg
  - term: mutton
    category: meat
    kind: concept
    answer:
      core:
        - meat from an adult sheep
    details: >-
      Tougher and stronger-tasting than [[lamb]]; common in British, Middle Eastern and South Asian cooking.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Lamb_and_mutton
    image: Lleyn sheep.jpg
  - term: kid (meat)
    category: meat
    kind: concept
    answer:
      core:
        - meat from a young goat
    details: >-
      Lean and mild, a little like [[lamb]]. Common in Italian, Greek, Middle Eastern and Caribbean cooking.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Goat_meat
    image: Baby goat Prašivá.jpg
  - term: gamey meat
    category: meat
    kind: concept
    answer:
      core:
        - a strong, wild, slightly iron-like flavor
    details: >-
      Typical of meat from animals that roam and forage, like deer and wild pigs, and of older animals.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Game_(hunting)
  - term: venison
    category: meat
    kind: concept
    answer:
      core:
        - meat from a deer
    details: >-
      Dark red, very lean and a little [[gamey meat|gamey]]. Usually served rare to medium, since it dries out easily.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Venison
    image: Red Deer Cervus Elaphus in Richmond Park 2023 02.jpg
  - term: wild boar
    category: meat
    kind: concept
    answer:
      core:
        - meat from a wild pig
    details: >-
      Darker, leaner and more [[gamey meat|gamey]] than [[pork]]; often slow-cooked into stews and [[pasta]] sauces in Italy.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Wild_boar
    image: Wild boar in San Rossore, Pisa, Italy.jpg
  - term: poultry
    category: meat
    kind: concept
    answer:
      core:
        - farmed birds, and their meat
    details: >-
      Chicken, turkey, duck and goose. Wild birds, like pheasant, count as [[game (meat)|game]] instead.
    compare:
      - game (meat)
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Poultry
    image: Rooster and Hen 03.jpg
  - term: game (meat)
    category: meat
    kind: concept
    answer:
      core:
        - meat from animals traditionally hunted, even if now farmed
    details: >-
      Like [[venison]], [[wild boar]], rabbit and wild birds such as pheasant. Usually leaner and more [[gamey meat|gamey]]
      than farm meat.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Game_(hunting)
    image: Common pheasant (Phasianus colchicus) male 2.jpg
  - term: offal
    category: meat
    kind: concept
    answer:
      core:
        - an animal’s organs and other inner parts, eaten as food
    details: >-
      Liver, kidneys, heart, tongue and more. Common in many cuisines; menus sometimes call them variety meats.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Offal
    image: Liver and Onions, Naxos Greek Restaurant, Thunder Bay (42214775140).jpg
  - term: steak
    category: meat
    kind: concept
    answer:
      core:
        - a thick slice of meat, quickly grilled or pan-fried
    details: >-
      Usually [[beef]], but tuna, [[pork]] and even cauliflower steaks exist. Beef steaks are named for the part of the cow
      they’re cut from; the most tender come from along the back.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Steak
    image: Steack sauce au madère.jpg
  - term: marbled meat
    category: meat
    kind: concept
    answer:
      core:
        - with thin streaks of fat running through the red meat
    details: >-
      The fat melts as the meat cooks, keeping it juicy and rich-tasting, so marbled [[steak|steaks]] cost more.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Marbled_meat
    image: T-bone-raw-MCB.jpg
  - term: dry-aged beef
    category: meat
    kind: concept
    answer:
      core:
        - '[[beef]] hung in a cold, dry room for weeks before cooking'
    details: >-
      Aging tenderizes the meat and concentrates its flavor, making it deeper and a little nutty. It’s costly, since the outside
      dries out and is trimmed away.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Beef_aging
    image: Dry-aged beef-01.jpg
  - term: braised meat
    category: meat
    kind: concept
    answer:
      core:
        - '[[browned]], then [[simmered]] slowly in a little liquid until tender'
    details: >-
      Braising turns tough, cheap [[cut of meat|cuts]] soft enough to cut with a fork, as in pot roast or osso buco.
    compare:
      - osso buco
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Braising
    image: American pot roast.jpg
  - term: sausage
    category: meat
    kind: concept
    answer:
      core:
        - seasoned ground meat stuffed into a thin tube, or casing
    details: >-
      The casing is traditionally cleaned intestine, now sometimes man-made. Some sausages must be cooked before eating; others
      are already cooked, or dried to be eaten as is.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Sausage
    image: Assorted Sausages with Fries.jpg
  - term: meatball
    category: meat
    kind: concept
    answer:
      core:
        - a ball of seasoned ground meat, usually [[beef]] or [[pork]]
    details: >-
      Spaghetti with meatballs is Italian-American; in Italy they’re usually smaller and served on their own.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Meatball
    image: Spaghetti and meatballs 1.jpg
    compare:
      - spaghetti
  - term: cold cuts
    category: meat
    kind: concept
    answer:
      core:
        - cooked or [[cured meat|cured]] meats, sliced thin and served cold
    details: >-
      The meats in a deli sandwich or on a platter: [[ham]], turkey, [[salame|salami]], bologna and the like. Also called
      lunch meat.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Lunch_meat
    image: Deli Meat, Tomatoes and Pickles.jpg
    compare:
      - bologna
  - term: deli meat
    category: meat
    kind: concept
    answer:
      core:
        - cooked or cured meats, sliced thin to order for sandwiches
    details: >-
      Sold at a deli counter, where it’s sliced from a big loaf or [[cut of meat|cut]], like deli turkey (turkey breast cooked
      in a loaf). The same thing as [[cold cuts]].
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Lunch_meat
    image: Meat slicer.jpg
  - term: cured meat
    category: meat
    kind: concept
    answer:
      core:
        - meat preserved with salt, often with spices, so it keeps much longer
    details: >-
      Salt draws water out of the meat, so bacteria can’t grow. Some cured meats keep for months without a fridge; others
      still need one.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Curing_(food_preservation)
    image: Salado Jamon Bellota Guijuelo Salamanca BEHER Bernardo Hernandez.jpg
  - term: dry-cured meat
    category: meat
    kind: concept
    answer:
      core:
        - '[[cured meat|cured]], then hung to dry for months; eaten raw, sliced thin'
    details: >-
      The long drying firms the meat and deepens its flavor.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Curing_(food_preservation)
    image: Bodega Curado Jamon BEHER Bernardo Hernandez Guijuelo Salamanca.JPG
  - term: smoked meat
    category: meat
    kind: concept
    answer:
      core:
        - meat hung in wood smoke, for flavor and to help preserve it
    details: >-
      Smoke gives meat a brown outside and a campfire flavor. Many meats are [[cured meat|cured]] first and then smoked.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Smoking_(cooking)
    image: Prosciutto smokehouse.JPG
  - term: crudo (meat)
    category: meat
    kind: concept
    answer:
      core:
        - 'raw: [[cured meat|cured]] rather than cooked'
      context:
        - Italian
    details: >-
      Italian for raw. Prosciutto crudo is the raw, cured [[ham]], as opposed to cooked ham.
    compare:
      - prosciutto crudo
      - prosciutto
    source:
      label: Wiktionary
      url: https://en.wiktionary.org/wiki/crudo#Italian
  - term: cotto
    category: meat
    kind: concept
    answer:
      core:
        - cooked
      context:
        - Italian
    details: >-
      Italian, as in prosciutto cotto, cooked [[ham]].
    compare:
      - prosciutto cotto
      - prosciutto
    source:
      label: Wiktionary
      url: https://en.wiktionary.org/wiki/cotto#Italian
  - term: ham
    category: meat
    kind: concept
    answer:
      core:
        - "[[pork]] from a pig’s back [[leg (meat)|leg]], [[cured meat|cured]], then cooked or dried"
    details: >-
      Cooked ham is the pink, moist sandwich kind; dried ham, like prosciutto, is salted and dried for months and eaten raw
      in paper-thin slices.
    compare:
      - prosciutto
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Ham
    image: A Spanish Ham at The Verandah.jpg
  - term: bacon
    category: meat
    kind: concept
    answer:
      core:
        - '[[cured meat|cured]], usually [[smoked meat|smoked]] [[pork]], sliced and fried'
    details: >-
      American bacon is strips with bands of fat, from the [[belly (meat)|belly]]; British and Canadian bacon are leaner,
      from the back. Pancetta is Italian bacon, usually unsmoked.
    compare:
      - pancetta
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Bacon
    image: Crispy Oven Roasted Bacon (8461921033).jpg
  - term: cured cut
    category: meat
    kind: concept
    answer:
      core:
        - a whole piece of meat, [[dry-cured meat|dry-cured]] and sliced thin
    details: >-
      Unlike [[salame|salami]], it isn’t ground, so each slice shows one solid piece of muscle. Coppa, bresaola and lonza
      are cured cuts.
    compare:
      - coppa
      - bresaola
      - lonza
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Salumi
  - term: fresh sausage
    category: meat
    kind: concept
    answer:
      core:
        - raw [[sausage]] that must be cooked before eating
    details: >-
      Italian sausage and breakfast sausage (usually ground [[pork]] with sage) are fresh sausages; they’re grilled, fried,
      or crumbled into sauces.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Sausage
    image: Raw sausages.jpg
  - term: cooked sausage
    category: meat
    kind: concept
    answer:
      core:
        - "[[sausage]] cooked when it’s made, so it’s ready to eat"
    details: >-
      Hot dogs and bologna are cooked sausages. They’re served cold in slices, or just heated through.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Sausage
    image: Wiener Wuerstchen (fcm).jpg
    compare:
      - bologna
  - term: blood sausage
    category: meat
    kind: concept
    answer:
      core:
        - "[[sausage]] made with animal blood, so it’s nearly black"
    details: >-
      The blood is mixed with fat and a filler like oats, rice or onions. Soft, and a little iron-tasting.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Blood_sausage
    image: Morcilla-burgos 2.jpg
  - term: meat spread
    category: meat
    kind: concept
    answer:
      core:
        - finely ground or shredded meat, served cold on bread or in slices
    details: >-
      Pâté is smooth, rillettes are shredded, and a terrine is a chunky loaf served in slices.
    compare:
      - pâté
      - rillettes
      - terrine
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/P%C3%A2t%C3%A9
    image: Rillettes and toast.JPG
  - term: charcuterie
    category: meat
    kind: concept
    answer:
      core:
        - cured and prepared meats, especially [[pork]], served cold
    details: >-
      Also the board they’re served on: a charcuterie board is a platter of sliced [[cured meat|cured]] meats, [[sausage|sausages]]
      and pâtés, often with cheese, pickles and bread.
    compare:
      - pâté
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Charcuterie
    image: Charcuterie board - Massachusetts.jpg
  - term: cut of meat
    category: meat
    kind: concept
    answer:
      core:
        - a piece of meat as a butcher sells it, taken from one part of the animal
    details: >-
      A part is a region of the animal, like the [[loin]] or the [[belly (meat)|belly]]; a cut is a particular piece taken
      from it, like a [[pork]] chop or a strip steak. One part yields several cuts. Tough cuts come from hard-working muscles
      and need slow cooking.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Cut_of_meat
  - term: leg (meat)
    category: meat
    kind: concept
    answer:
      core:
        - 'the upper back leg: large and lean'
    details: >-
      Any animal’s. On a pig it’s cured or cooked whole; on a cow it’s called the round, a lean [[cut of meat|cut]] often
      roasted; leg of [[lamb]] is a classic roast.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Ham
    image: Schwein-Schinken.png
  - term: belly (meat)
    category: meat
    kind: concept
    answer:
      core:
        - 'the underside: layers of fat and meat'
    details: >-
      Any animal’s, though [[pork]] belly is by far the most common on menus. Rich and fatty; roasted until its skin turns
      crisp, or [[cured meat|cured]] and sliced.
    compare:
      - pancetta
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pork_belly
    image: Schwein-Bauch.png
  - term: jowl
    category: meat
    kind: concept
    answer:
      core:
        - 'the cheek and lower jaw: very fatty'
    details: >-
      Almost always a pig’s; on a cow, menus say cheek instead. [[pork|Pork]] jowl is [[cured meat|cured]] as guanciale, the
      traditional meat in carbonara.
    compare:
      - guanciale
      - carbonara
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Jowl
    image: Porc-Bajoue.png
  - term: neck (meat)
    category: meat
    kind: concept
    answer:
      core:
        - 'the neck: [[marbled meat|marbled]] and flavorful'
    details: >-
      Any animal’s. [[lamb|Lamb]] neck is stewed; [[pork]] neck, together with the top of the [[shoulder (meat)|shoulder]],
      is [[cured meat|cured]] as coppa.
    compare:
      - coppa
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Capocollo
    image: Schwein-Nacken.png
  - term: shoulder (meat)
    category: meat
    kind: concept
    answer:
      core:
        - 'the upper front [[leg (meat)|leg]]: hard-working, so tough, and fairly fatty'
    details: >-
      Any animal’s. [[pork|Pork]] and [[lamb]] shoulder are roasted or slow-cooked, and pulled pork is pork shoulder; on a
      cow, the shoulder is called the chuck, used for pot roast and ground [[beef]].
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pork_shoulder
    image: Schwein-Schulter.png
  - term: loin
    category: meat
    kind: concept
    answer:
      core:
        - 'the strip along the back: lean and tender'
    details: >-
      Any animal’s. Tender and costly: [[pork]] chops (steaks cut with a bone) and the best beef [[steak|steaks]] are cut
      from it.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Loin
    image: Schwein-Ruecken.png
  - term: tenderloin
    category: meat
    kind: concept
    answer:
      core:
        - a small, very tender muscle tucked under the [[loin]]
    details: >-
      It does little work as the animal moves, and muscles that work less stay tender, so it’s the most tender cut of all,
      and costly. Any animal’s: in beef it gives filet mignon, and [[pork]] tenderloin is common too.
    compare:
      - filet mignon
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Tenderloin
    image: Beef cuts France Filet highlighted.svg
    mirror_image: true
  - term: rib (meat)
    category: meat
    kind: concept
    answer:
      core:
        - the ribs and the meat around them, toward the front of the animal
    details: >-
      Any animal’s. Beef ribs are richly [[marbled meat|marbled]] and give ribeye steaks and prime rib; [[pork]] gives spare
      ribs.
    compare:
      - ribeye
      - prime rib
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Rib_steak
    image: Beef cuts France Côtes et entrecôtes highlighted.svg
    mirror_image: true
  - term: flank (meat)
    category: meat
    kind: concept
    answer:
      core:
        - 'the lower belly behind the [[rib (meat)|ribs]]: lean and chewy'
    details: >-
      Menus mean a cow’s: a long, flat muscle, best grilled quickly and sliced thin against its long fibers. (The fatty [[belly
      (meat)|belly]] of a pig is further forward.)
    compare:
      - flank steak
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Flank_steak
    image: Beef cuts France Flanchet highlighted.svg
    mirror_image: true
  - term: shank
    category: meat
    kind: concept
    answer:
      core:
        - 'the lower [[leg (meat)|leg]]: tough, and best cooked slowly'
    details: >-
      Any animal’s. Full of tough, stretchy tissue that turns soft and silky with long [[braised meat|braising]]: [[veal]]
      shank is osso buco, and [[lamb]] shanks are braised whole.
    compare:
      - osso buco
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Shank_(meat)
    image: Beef cuts France Gîte highlighted.svg
    mirror_image: true
  - term: trotter
    category: meat
    kind: concept
    answer:
      core:
        - a pig’s foot
    details: >-
      Always a pig’s; other animals’ feet are just called feet. Mostly skin, tendons and bone, cooked slowly until soft and
      sticky, or stuffed, as in zampone.
    compare:
      - zampone
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pig%27s_trotters
    image: Schwein-Pfoten.png
  - term: back fat
    category: meat
    kind: concept
    answer:
      core:
        - the thick layer of pure fat along a pig’s back
    details: >-
      Always a pig’s. Used in [[sausage|sausages]], or [[cured meat|cured]] on its own as lardo.
    compare:
      - lardo
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Fatback
    image: Schwein-Rueckenspeck.png
  - term: protected geographical indication
    category: meat
    kind: concept
    answer:
      core:
        - 'a looser legal label: made in its home region, though not every ingredient or step must be local'
    details: >-
      Weaker than a [[protected designation of origin]]: a [[ham]] labeled this way must be [[cured meat|cured]] in its home
      region, but its pigs may come from elsewhere.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Protected_geographical_indication
    image: Speck of South Tyrol.jpg
  - term: IGP
    category: meat
    kind: concept
    translates: protected geographical indication
    answer:
      core:
        - '[[protected geographical indication]]'
      context:
        - Italian and French abbreviation (indicazione geografica protetta; indication géographique protégée)
    details: >-
      As in mortadella Bologna IGP or speck Alto Adige IGP.
    compare:
      - mortadella
      - speck
      - bologna
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Protected_geographical_indication
  - term: PGI
    category: meat
    kind: concept
    translates: protected geographical indication
    answer:
      core:
        - '[[protected geographical indication]]'
      context:
        - English abbreviation
    details: >-
      The EU-wide label, as written in English.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Protected_geographical_indication
  - term: bleu (steak)
    category: meat
    kind: concept
    answer:
      core:
        - 'very rare: [[browned]] quickly outside, cool and red inside'
      context:
        - French
    details: >-
      The rarest [[steak]] you can order in France; ask for it only if you like meat nearly raw.
    source:
      label: Wiktionary
      url: https://en.wiktionary.org/wiki/bleu#French
  - term: saignant
    category: meat
    kind: concept
    answer:
      core:
        - rare
      context:
        - French
    details: >-
      Literally “bleeding”: red and warm in the middle.
    source:
      label: Wiktionary
      url: https://en.wiktionary.org/wiki/saignant#French
  - term: à point
    category: meat
    kind: concept
    answer:
      core:
        - medium rare to medium
      context:
        - French
    details: >-
      Literally “just right”: pink in the middle.
    source:
      label: Wiktionary
      url: https://en.wiktionary.org/wiki/%C3%A0_point#French
  - term: bien cuit
    category: meat
    kind: concept
    answer:
      core:
        - well done
      context:
        - French
    details: >-
      Literally “well cooked”: no pink left.
    source:
      label: Wiktionary
      url: https://en.wiktionary.org/wiki/bien_cuit#French
  - term: al sangue
    category: meat
    kind: concept
    answer:
      core:
        - rare
      context:
        - Italian
    details: >-
      Literally “in the blood”: red in the middle.
    source:
      label: Wiktionary
      url: https://en.wiktionary.org/wiki/al_sangue#Italian
  - term: ben cotto
    category: meat
    kind: concept
    answer:
      core:
        - well done
      context:
        - Italian
    details: >-
      Literally “well [[cotto|cooked]]”: no pink left.
    source:
      label: Wiktionary
      url: https://en.wiktionary.org/wiki/ben_cotto#Italian
  - term: polpette
    category: meat
    kind: concept
    translates: meatball
    answer:
      core:
        - '[[meatball|meatballs]]'
      context:
        - Italian
    details: >-
      The singular is polpetta.
    source:
      label: Wiktionary
      url: https://en.wiktionary.org/wiki/polpetta#Italian
    image_from: meatball
  - term: salumi
    category: meat
    kind: concept
    translates: charcuterie
    answer:
      core:
        - '[[charcuterie]]: cured meats'
      context:
        - Italian; not salami, which is one kind
    details: >-
      A plate of salumi misti is a mixed selection: prosciutto, [[salame|salami]], coppa and more.
    compare:
      - salame
      - prosciutto
      - coppa
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Salumi
    image_from: charcuterie
  - term: salami / salame
    id: salame
    category: meat
    kind: concept
    answer:
      core:
        - '[[dry-cured meat|dry-cured]] [[sausage]], sliced and eaten without cooking'
      context:
        - Italian; salame is the singular
