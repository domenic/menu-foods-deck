  - term: tortellini
    category: pasta
    answer:
      core:
        - small ring-shaped stuffed pasta
    details: >-
      Tortellini is a type of stuffed pasta typical of the Italian cities of Bologna and Modena, in the
      Emilia-Romagna region. Traditionally it is stuffed with a mix of meat (pork loin, prosciutto, mortadella),
