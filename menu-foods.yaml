cards:
  - term: acini di pepe
    category: pasta
    answer:
      core:
        - Tiny bead-shaped pasta
    details: >-
      Acini di pepe (Italian: [ˈaːtʃini di ˈpeːpe]; lit. 'seeds of pepper') is a type of pasta. Acini
      is the plural of acino whose root is the Latin word acinus.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Acini_di_pepe
    image: Acini_di_Pepe.jpg
  - term: agnolotti
    category: pasta
    answer:
      core:
        - Small stuffed pasta parcels
    details: >-
      Agnolotti (Italian: [aɲɲoˈlɔtti]; Piedmontese: agnolòt, Piedmontese: [aɲʊˈlɔt]), also known as agnolotti
      piemontesi, is a type of stuffed pasta typical of the Piedmont region of Italy, made with small
      pieces of flattened dough folded over a filling of roasted meat or vegetables. Agnolotti can be
      di magro or di grasso depending on their filling of vegetables or meat.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Agnolotti
    image: Agnolotti.JPG
  - term: anelli
    category: pasta
    answer:
      core:
        - Small ring-shaped pasta
    details: >-
      Anelli (also known as anellini or anelletti) are small, thin rings of pasta. They are generally
      used for soups and pasta salads.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Anelli
    image: Uncooked_anellini_pasta.jpg
  - term: bigoli
    category: pasta
    answer:
      core:
        - Thick, rough spaghetti-like pasta
    details: >-
      Bigoli (Italian: [ˈbiːɡoli]; Venetian: bìgołi) is an extruded pasta in the form of a long and thick
      strand. Initially bigoli were made with buckwheat flour, but are now more commonly made with whole-wheat
      flour, and sometimes include duck eggs.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Bigoli
    image: Bigoli2.jpg
  - term: bucatini
    category: pasta
    answer:
      core:
        - Thick spaghetti with a hollow center
    details: >-
      Bucatini (Italian: [bukaˈtiːni]), also known as perciatelli (Italian: [pertʃaˈtɛlli]), is a thick
      spaghetti-like pasta with a hole running through the center. It is common throughout Lazio, particularly
      Rome.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Bucatini
    image: Bucatini.jpg
  - term: busiate
    category: pasta
    answer:
      core:
        - Long, tightly twisted pasta
      context:
        - Sicilian
    details: >-
      Busiate or busiati are a type of long macaroni, originating in the province of Trapani and typical
      of the Calabria and Sicily regions of Italy. They take their name from busa, the Sicilian word for
      the stem of Ampelodesmos mauritanicus, a local grass, which is used in preparing them and giving
      them their helical shape.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Busiate
    image: Busiate.jpg
  - term: calamarata
    category: pasta
    answer:
      core:
        - Thick squid-ring-shaped pasta
    details: >-
      Calamarata is a type of thick ring pasta, often dyed with black squid ink to resemble sliced calamari.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Calamarata
    image: Calamari2.jpg
  - term: campanelle
    category: pasta
    answer:
      core:
        - Ruffled cone or bell-shaped pasta
    details: >-
      Campanelle (Italian: [kampaˈnɛlle]; Italian for 'bellflowers' or 'little bells') is a type of pasta
      which is shaped like a cone with a ruffled edge, or a bell-like flower. It is also sometimes referred
      to as gigli ('lilies') or trompetti ('trumpets').
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Campanelle
    image: Gigli.jpg
  - term: cannelloni
    category: pasta
    answer:
      core:
        - Large pasta tubes meant for stuffing
    details: >-
      Cannelloni (Italian: [kannelˈloːni]; Italian for 'large reeds') are a cylindrical type of egg-based
      stuffed pasta generally served baked with a filling and covered by a sauce in Italian cuisine. Popular
      stuffings include spinach and ricotta or minced beef.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Cannelloni
    image: Cannelloni2.png
  - term: capellini
    category: pasta
    answer:
      core:
        - Very thin strands
        - angel-hair pasta
    details: >-
      Capellini (Italian: [kapelˈliːni]; lit. 'little hairs') is a thin variety of pasta, with a diameter
      ranging from 0.85 to 0.92 mm (0.033 to 0.036 in). It is made in the form of long, thin strands,
      similar to spaghetti.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Capellini
    image: Capelli_angelo_front.jpg
  - term: cappellacci
    category: pasta
    answer:
      core:
        - Large hat-shaped stuffed pasta
    details: >-
      Cappellacci are large, hat-shaped stuffed egg-pasta parcels associated with Ferrara. The classic
      cappellacci di zucca are filled with pumpkin, Parmigiano Reggiano, breadcrumbs, and nutmeg, although
      menu fillings can vary.
    reference:
      label: Ferrara tourism
      url: https://www.inferrara.it/en/p/12/food/i-cappellacci-di-zucca-igp
    image: Caplét ad suca.jpg
  - term: cappelletti
    category: pasta
    answer:
      core:
        - Small hat-shaped stuffed pasta
    details: >-
      Cappelletti (Italian: [kappelˈletti]) are ring-shaped stuffed pasta; they are named for the characteristic
      shape that resembles a hat (cappello in Italian). Compared to tortellini, they have a different
      shape, larger size, thicker dough and different filling.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Cappelletti_(pasta)
    image: 02_Cappelletti_-_Cappellacci_-_Pasta_ripiena_-_Cucina_tipica_-_Ferrara.jpg
  - term: casarecce
    category: pasta
    answer:
      core:
        - Short, loosely rolled S-shaped pasta
    details: >-
      Casarecce (from Italian casereccio, 'homemade') are short twists of pasta originating in the Sicily
      region of Italy which appear rolled up on themselves like a scroll. Casarecce pairs well with cream/cheese,
      meat, napolitana, seafood, pesto, and vegetables.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Casarecce
    image: Casarecce2.jpg
  - term: cavatappi
    category: pasta
    answer:
      core:
        - Hollow corkscrew-shaped pasta
    details: >-
      Cavatappi (Italian: [kavaˈtappi]; lit. 'corkscrews'), also known as spirali, cellentani, amori,
      fusilli rigati, or curly mac, is macaroni formed in a helical tube shape. Certain areas of the US
      and Canada may also refer to it as "double elbows" or "scoobi doo" pasta, purportedly because of
      their resemblance to scoubidou.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Cavatappi
    image: Cellentani2.jpg
  - term: cavatelli
    category: pasta
    answer:
      core:
        - Small folded pasta shells with a hollow
    details: >-
      Cavatelli are small pasta shells made from semolina or other flour dough, commonly cooked with garlic
      and broccoli or rapini, or simply with tomato sauce. A variant adds ricotta cheese to the dough
      mix.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Cavatelli
    image: Cavatelli.jpg
  - term: conchiglie
    category: pasta
    answer:
      core:
        - Seashell-shaped pasta
    details: >-
      Conchiglie (Italian: [koŋˈkiʎʎe]) are a type of pasta. They are usually sold in the plain durum
      wheat variety, and also in colored varieties which use natural pigments, such as tomato extract,
      squid ink or spinach extract.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Conchiglie
    image: Conchiglie_rigate.png
  - term: corzetti
    category: pasta
    answer:
      core:
        - Thin round pasta coins, often stamped
    details: >-
      Corzetti or croxetti (Ligurian: [kur'zetˑi] or [kru'ʒetˑi]) are a type of pasta typical of the Ligurian
      cuisine of northwest Italy, and also traditional in the area of Novi Ligure just across the border
      with Piedmont, in the province of Alessandria. Corzetti originated in Liguria, in northern Italy
      along the border with France, during the Middle Ages.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Corzetti
    image: Croxetti.png
  - term: ditalini
    category: pasta
    answer:
      core:
        - Very short, tiny pasta tubes
    details: >-
      Ditalini (Italian: [ditaˈliːni]; English: "small thimbles"), also referred to as tubettini, is a
      type of pasta that is shaped like small tubes. It has been described as "thimble-sized" and as "very
      short macaroni".
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Ditalini
    image: Ditalini-230.jpg
  - term: farfalle
    category: pasta
    answer:
      core:
        - Bow-tie or butterfly-shaped pasta
    details: >-
      Farfalle (Italian: [farˈfalle]) are a type of pasta. The name is derived from the Italian word farfalle
      ('butterflies').
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Farfalle
    image: Farfalle_Pasta.JPG
  - term: fettuccine
    category: pasta
    answer:
      core:
        - Flat, medium-width pasta ribbons
    details: >-
      Fettuccine is a type of pasta popular in Roman cuisine. It is descended from the extremely thin
      capelli d'angelo of the Renaissance, but is a flat, thick pasta traditionally made with egg and
      flour (usually one egg for every 100 grams or 3.5 ounces of flour).
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Fettuccine
    image: Fettucine1.JPG
  - term: fileja
    category: pasta
    answer:
      core:
        - Long, narrow corkscrews
      context:
        - Calabrian
    details: >-
      Fileja (pronounced [fɪˈlɛːja]) is a type of pasta typical from the province of Vibo Valentia, Calabria.
      Made of durum wheat semolina and water, they are prepared by wrapping a sheet of pasta around a
      thin cane (dinaciulu), creating a hollow tube approximately 20 cm in length.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Fileja
    image: Fileja.jpg
  - term: fregola
    category: pasta
    answer:
      core:
        - Small toasted pasta balls
      context:
        - Sardinian
    details: >-
      Fregula (often written fregola) is a type of semolina pasta from the Sardinia region of Italy.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Fregula
    image: UncookedFregula.jpg
  - term: fusilli
    category: pasta
    answer:
      core:
        - Short spiral or corkscrew pasta
    details: >-
      Fusilli (Italian: [fuˈzilli]) are a variety of pasta from southern Italy, with a helical (corkscrew)
      or helicoidal shape, also known as rotini in the United States and Canada.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Fusilli
    image: Fusilli pasta.jpg
  - term: garganelli
    category: pasta
    answer:
      core:
        - Ridged pasta tubes with a visible seam
      context:
        - egg pasta
    details: >-
      Garganelli (Italian: [ɡarɡaˈnɛlli]; Romagnol: garganéi) are a type of egg-based pasta from the Emilia-Romagna
      region of Italy. They are formed by rolling a flat, square noodle into a cylindrical shape over
      a ridged wooden board, giving the pasta ridges.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Garganelli
    image: Garganelli_(10348149363).jpg
  - term: gemelli
    category: pasta
    answer:
      core:
        - Short pasta twisted like paired strands
    details: >-
      Gemelli (Italian: [dʒeˈmɛlli]; lit. 'twins') are a type of pasta. They are most often used for making
      casserole or pasta salads.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Gemelli_(pasta)
    image: Gemelli.jpg
  - term: gnocchi
    category: pasta
    answer:
      core:
        - Soft dumplings, usually made with potato
    details: >-
      Gnocchi are a varied family of pasta-like dumplings in Italian cuisine. They are made of small rolls
      of dough, such as those composed of a simple combination of wheat flour, potato, egg, and salt.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Gnocchi
    image: Gnocchi_di_ricotta_burro_e_salvia.jpg
  - term: lasagne
    category: pasta
    answer:
      core:
        - Wide flat pasta sheets
        - also the layered dish
    details: >-
      Lasagna, also known by the plural form lasagne, is a type of pasta made in wide, flat sheets. It
      originates in Italian cuisine, where it is served in a number of ways, including in broth (lasagne
      in brodo), but is best known for its use in a baked dish made by stacking layers of pasta, alternating
      with fillings such as ragù (ground meats and tomato sauce), béchamel sauce, vegetables, cheeses
      (which may include ricotta, mozzarella, and Parmesan), and seasonings and spices.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Lasagna
    image: Lasagne_-_stonesoup.jpg
  - term: linguine
    category: pasta
    answer:
      core:
        - Long, narrow, slightly flattened strands
    details: >-
      Linguine (lit. 'little tongues'), sometimes anglicized as linguini, is a type of pasta similar to
      fettuccine and trenette, distinguished by its elliptical rather than flat section. Around about
      4 millimetres (5⁄32 in) in width, it is wider than spaghetti, but less wide than fettuccine.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Linguine
    image: Linguine.jpg
  - term: lumache
    category: pasta
    answer:
      core:
        - Curved, hollow snail-shell-shaped pasta
    details: >-
      Lumache (Italian for “snails”) are short, curved, hollow pasta pieces shaped like snail shells,
      often with ridges and one pinched end. Their hollow shape is well suited to catching thick or chunky
      sauces.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/List_of_pasta#Short-cut_extruded_pasta
    image: Lumache pasta.jpg
  - term: mafaldine
    category: pasta
    answer:
      core:
        - Long ribbons with ruffled edges
    details: >-
      Mafaldine, also known as reginette (Italian for 'little queens') or simply mafalde, is a type of
      ribbon-shaped pasta.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Mafaldine
    image: Reginette.jpg
  - term: malloreddus
    category: pasta
    answer:
      core:
        - Small ridged pasta shells
      context:
        - Sardinian
    details: >-
      Malloreddus, sometimes Italianized as gnocchetti sardi, are a type of pasta typical of Sardinian
      cuisine. They have the shape of thin ribbed shells, about 2 cm (0.79 in) long, and are made of semolina
      flour and water.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Malloreddus
    image: Sardo_Cucina,_Fitzrovia,_London_(5147126888).jpg
  - term: manicotti
    category: pasta
    answer:
      core:
        - Large ridged pasta tubes meant for stuffing
    details: >-
      Manicotti (the plural form of the Italian word manicotto; < manica, 'sleeve', + the augmentative
      ending, -otto) are a type of pasta in Italian and Italian-American cuisine. They are large pasta
      tubes intended to be stuffed and baked.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Manicotti
    image: EMS-109321-Manicotti-rule..JPG
  - term: mezze maniche
    category: pasta
    answer:
      core:
        - Short, wide ridged pasta tubes
    details: >-
      Mezze maniche are short, wide pasta tubes whose name means “half sleeves.” They are about half the
      length of rigatoni and are commonly ridged to catch thick sauces.
    reference:
      label: De Cecco
      url: https://www.dececco.com/it_it/product/mezze-maniche-rigate-n-136/
    image: Mezze maniche2.jpg
  - term: orecchiette
    category: pasta
    answer:
      core:
        - Small ear-shaped pasta
    details: >-
      Orecchiette is a pasta typical of the Apulia region of Italy. Their name comes from the Italian
      word for "ear," a reference to their shape.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Orecchiette
    image: Orecchiette_carbonara.jpg
  - term: orzo
    category: pasta
    answer:
      core:
        - Rice-shaped pasta—not rice
    details: >-
      Orzo (Italian: [ˈɔrdzo]; lit. 'barley'; from Latin hordeum), also known in Italy as risoni (Italian:
      [riˈzoːni]; 'large [grains of] rice'), and popular in Greek cuisine as kritharaki (κριθαράκι), is
      a form of short-cut pasta shaped like a large grain of rice. Orzo is made from flour, often with
      semolina.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Orzo
    image: Orzo.jpg
  - term: paccheri
    category: pasta
    answer:
      core:
        - Very large, wide pasta tubes
    details: >-
      Paccheri (Italian: [ˈpakkeri]) is a type of pasta in the shape of a very large tube, originating
      from the Campania region of Italy. They are generally smooth, but there is also a ribbed version,
      paccheri millerighe.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Paccheri
    image: Paccheri3.jpg
  - term: pappardelle
    category: pasta
    answer:
      core:
        - Very broad, flat pasta ribbons
    details: >-
      Pappardelle (Italian: [papparˈdɛlle]; sing.: pappardella; from the Italian verb pappare, meaning
      'to gobble up') are large, very broad, flat pasta, similar to wide fettuccine, originating from
      the Tuscany region of Italy. The fresh types are two to three centimetres (3⁄4–1 inches) wide and
      may have fluted edges, while dried egg pappardelle have straight sides.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pappardelle
    image: Pappardelle.jpg
  - term: passatelli
    category: pasta
    answer:
      core:
        - Soft breadcrumb-and-egg noodle-like strands
    details: >-
      Passatelli are a pasta formed of bread crumbs, eggs, grated Parmesan cheese, and in some regions
      lemon, and nutmeg; it is typically cooked in chicken broth. Typically, it is found mainly in Romagna,
      Pesaro and Urbino province (northern Marche), Ancona province (central Marche) and other regions
      of Italy, such as Umbria.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Passatelli
    image: Passatelli.jpg
  - term: pastina
    category: pasta
    answer:
      core:
        - Any very small pasta
      context:
        - usually for soup
    details: >-
      Pastina (lit. 'little pasta') is a variety of pasta consisting of tiny pieces, typically of a round
      (irregular) shape with a diameter of about two millimetres (1⁄16 inch). It is the smallest type
      of pasta produced.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pastina
    image: Pasta_2006_4.jpg
  - term: penne
    category: pasta
    answer:
      core:
        - Short diagonal-cut pasta tubes
    details: >-
      Penne (Italian: [ˈpenne]) are an extruded type of pasta in the shape of tubular pieces with ends
      cut at an angle. They are usually made from wheat flour.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Penne
    image: Pennelisce_closeup.png
  - term: pici
    category: pasta
    answer:
      core:
        - Thick, hand-rolled spaghetti
      context:
        - Tuscan
    details: >-
      Pici (Italian: [ˈpiːtʃi], locally [ˈpiːʃi]) is thick, hand-rolled pasta, like fat spaghetti. It
      originates in the province of Siena, in Tuscany; in the Montalcino area it is also referred to as
      pinci (Italian: [ˈpintʃi]).
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pici
    image: Pici_con_albume.jpeg
  - term: pizzoccheri
    category: pasta
    answer:
      core:
        - Short, flat buckwheat pasta ribbons
    details: >-
      Pizzoccheri (Italian: [pitˈtsɔkkeri]; Lombard: pizzòcher, pronounced [piˈtsɔker, -kar]) is a flat
      ribbon pasta, made with a blend of buckwheat flour and wheat flour. It is believed to have originated
      in Valtellina, a valley in the northern Italian region of Lombardy.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Pizzoccheri
    image: Pizzoccheri.jpg
  - term: radiatori
    category: pasta
    answer:
      core:
        - Short pasta shaped like little radiators
    details: >-
      Radiatori are small, squat pasta shapes that are said to resemble radiators. Although it is rumored
      that they were created in the 1960s by an industrial designer, their invention was actually between
      the First and Second World War.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Radiatori
    image: Radiatori.jpg
  - term: ravioli
    category: pasta
    answer:
      core:
        - Filled pasta pillows
    details: >-
      Ravioli (Italian: [raviˈɔli]; sing.: raviolo, Italian: [raviˈɔlo]) are a type of stuffed pasta comprising
      a filling enveloped in thin pasta dough. Usually served in broth or with a sauce, they originated
      as a traditional food in Italian cuisine.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Ravioli
    image: Flickr_-_cyclonebill_-_Ravioli_med_skinke_og_asparges_i_mascarponecreme.jpg
  - term: rigatoni
    category: pasta
    answer:
      core:
        - Large ridged pasta tubes with square-cut ends
    details: >-
      Rigatoni (Italian: [riɡaˈtoːni]) is a type of pasta. They are larger than penne and ziti, and sometimes
      slightly curved, but not as curved as elbow macaroni.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Rigatoni
    image: Rigatoni.jpg
  - term: rotelle
    category: pasta
    answer:
      core:
        - Wagon-wheel-shaped pasta
    details: >-
      Rotelle is a type of pasta resembling wheels with spokes. They are similar to fiori.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Rotelle
    image: Rotelle2.jpg
  - term: rotini
    category: pasta
    answer:
      core:
        - Short, tight corkscrew pasta
    details: >-
      Fusilli (Italian: [fuˈzilli]) are a variety of pasta from southern Italy, with a helical (corkscrew)
      or helicoidal shape, also known as rotini in the United States and Canada.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Fusilli
    image: Rotini.jpg
  - term: scialatielli
    category: pasta
    answer:
      core:
        - Short, thick, flat ribbons
      context:
        - from Campania
    details: >-
      Scialatielli or scialatelli (Italian: [ʃalaˈt(j)ɛlli]), also known as sciliatielli or scivatieddi,
      is a short, thick pasta with a rectangular cross section and an irregular, slightly curved shape.
      It is typical of modern Campanian cuisine, having originated on the Amalfi Coast as a chef's specialty,
      but it has also spread to nearby areas such as Catanzaro, Calabria, and Potenza, Basilicata.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Scialatielli
    image: Scialatielli.jpg
  - term: spaghetti
    category: pasta
    answer:
      core:
        - Long, thin round pasta strands
    details: >-
      Spaghetti (Italian: [spaˈɡetti] 'little strings' plural diminutive of spago 'string') is a long,
      thin, solid, cylindrical pasta. It serves as a staple food of Italian cuisine and is made of milled
      wheat and water, with the standard Italian version using durum-wheat semolina.
    reference:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Spaghetti
    image: Spaghettoni.jpg
  - term: spaghettini
    category: pasta
    answer:
      core:
        - Thin spaghetti strands
    details: >-
      Spaghettini are long, round pasta strands with a smaller diameter than standard spaghetti. Their
      thinness gives them a shorter cooking time and makes them well suited to lighter sauces.
    reference:
      label: Barilla
      url: https://www.barilla.com/it-it/prodotti/pasta/i-classici/spaghettini
    image: Spaghettini Ai Gamberi.jpg
  - term: strozzapreti
    category: pasta
    answer:
      core:
        - Short, hand-rolled twisted pasta
    details: >-
