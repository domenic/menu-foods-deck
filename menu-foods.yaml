  - term: spaghetti
    category: pasta
    answer:
      core:
        - long, thin round pasta strands
    details: >-
      Spaghetti (Italian: [spaˈɡetti] 'little strings' plural diminutive of spago 'string') is a long,
      thin, solid, cylindrical pasta. It serves as a staple food of Italian cuisine and is made of milled
      wheat and water, with the standard Italian version using durum-wheat semolina.
