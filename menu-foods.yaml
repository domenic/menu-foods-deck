        - plain sweet-cream [[gelato]]
    details: >-
      Italian for “flower of milk”. Just milk, cream and sugar with no other flavoring: the base that many other gelato flavors
      start from.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Gelato
    image: Il Gelato al Fiordilatte.jpg
  - term: stracciatella (gelato)
    category: dessert
    answer:
      core:
        - '[[gelato]] with fine shavings of chocolate'
    details: >-
      Italian for “little rags”. Melted chocolate is drizzled into plain sweet-cream gelato as it churns, where it hardens
      and breaks into thin, crisp shreds, like chocolate-chip ice cream but finer.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Stracciatella_(ice_cream)
    image: Cono LaStracciatellailgelatodiBergamo.jpg
  - term: stracciatella (soup)
    category: dish
    answer:
      core:
        - Roman egg-drop soup
    details: >-
      Italian for “little rags”. Beaten egg and grated cheese are stirred into hot broth, where they set into thin, ragged
      shreds.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Stracciatella_(soup)
    image: Straciatella - bowl.JPG
  - term: dolce (dessert)
    category: dessert
    kind: concept
    answer:
      core:
        - dessert
      context:
        - Italian; plural dolci; as an adjective, sweet
    details: >-
      The dolci section of an Italian menu lists the desserts. As an adjective it means sweet, as in vino dolce, a sweet wine.
    source:
      label: Wiktionary
      url: https://en.wiktionary.org/wiki/dolce#Italian
  - term: piccante (dish)
    category: other
    kind: concept
    answer:
      core:
        - spicy; hot with chili
      context:
        - Italian
    details: >-
      As in [[salame]] piccante, a salami made with chili, or a pizza piccante.
    source:
      label: Wiktionary
      url: https://en.wiktionary.org/wiki/piccante#Italian
  - term: raclette (dish)
    category: dish
    answer:
      core:
        - melted cheese scraped over boiled potatoes
      context:
        - Swiss; with pickles
    details: >-
      A [[wheel (cheese)|half-wheel]] of [[raclette|raclette cheese]] is heated until its surface melts, then scraped onto
      each plate. Today, tabletop grills with little pans are common. Served with [[cornichons]] and pickled onions.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Raclette
    image: Raclette_20040817_140816.jpg
  - term: fondue
    category: dish
    answer:
      core:
        - a shared pot of melted cheese for dipping bread
      context:
        - Swiss
    details: >-
      Cheese is melted with white wine and garlic in a pot kept warm at the table, and everyone dips cubes of bread on long
      forks. Classic fondue uses [[Alpine-style cheese|Alpine cheeses]] like gruyère and emmental. Chocolate fondue, for dipping
      fruit, is a dessert version.
    compare:
      - gruyère
      - emmental
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Fondue
    image: Swiss fondue.jpg
  - term: tartiflette
    category: dish
    answer:
      core:
        - baked potatoes, [[bacon]] and onions under melted [[reblochon]]
      context:
        - from the French Alps
    details: >-
      A bubbling, cheesy casserole from the French Alps: a whole reblochon is halved and laid on top, so its rind browns as
      it melts into the potatoes.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Tartiflette
    image: Une tartiflette sortie du four.jpg
  - term: frico
    category: dish
    answer:
      core:
        - a crisp, fried cheese pancake
      context:
        - from northeast Italy
    details: >-
      Grated [[montasio]] is fried until it melts into a lacy, golden disk. Thin frico is crunchy, like a cracker; thicker
      versions are made with potatoes and onions and stay soft inside.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Frico
    image: Fricoepolenta.jpg
  - term: cacio e pepe
    category: dish
    answer:
      core:
        - pasta with [[pecorino romano]] and black pepper
      context:
        - Roman
    details: >-
      Italian for “cheese and pepper”. Grated pecorino and pasta water are tossed with hot pasta until they make a creamy
      sauce, with lots of black pepper. Usually made with long pasta like [[spaghetti]] or [[tonnarelli]].
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Cacio_e_pepe
    image: Cacio e pepe.jpg
  - term: elote
    category: dish
    answer:
      core:
        - grilled corn on the cob with mayonnaise, [[cotija]] and chili
      context:
        - Mexican street food
    details: >-
      Mexican Spanish for corn on the cob. The grilled corn is slathered with mayonnaise or sour cream, rolled in crumbled
      cotija, and sprinkled with chili powder and lime. Esquites is the same thing cut off the cob and served in a cup.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Elote
    image: ELOTE.jpg
  - term: truffle (fungus)
    category: vegetable
    answer:
      core:
        - a costly, strongly aromatic underground mushroom
      context:
        - shaved over food
    details: >-
      Truffles grow underground on tree roots and are sniffed out by trained dogs or pigs. Black and white truffles are shaved
      raw over pasta, eggs or risotto; a little goes a long way. “Truffle oil” and truffle fries are usually flavored with
      a synthetic aroma instead.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Truffle
    image: Tuber melanosporum Vittadini 1831 (Fungi Ascomycota Pezizomycotina Pezizomycetes Pezizales Tuberaceæ) 
      (25817500456) cropped.jpg
  - term: truffle (chocolate)
    category: dessert
    answer:
      core:
        - a ball of chocolate mixed with cream, coated in cocoa or chocolate
    details: >-
      Named for its resemblance to the lumpy, cocoa-colored fungus.
    compare:
      - truffle (fungus)
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Chocolate_truffle
    image: Truffles with nuts and chocolate dusting in detail.jpg
  - term: tartufo (fungus)
    category: vegetable
    kind: concept
    translates: truffle (fungus)
    answer:
      core:
        - '[[truffle (fungus)|truffle]]'
      context:
        - Italian
    details: >-
      As in [[tagliatelle]] al tartufo. Tartufo nero is black truffle; tartufo bianco, white truffle.
    source:
      label: Wiktionary
      url: https://en.wiktionary.org/wiki/tartufo#Italian
    image_from: truffle (fungus)
  - term: tartufo (dessert)
    category: dessert
    answer:
      core:
        - a ball of [[gelato]] with a hidden center, coated in cocoa or chocolate
      context:
        - Italian
    details: >-
      Named for its resemblance to a truffle. The classic version, from southern Italy, is hazelnut and chocolate gelato around
      a molten chocolate center.
    compare:
      - truffle (fungus)
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Tartufo
    image: Italian tartufo with rolled chocolate sticks.jpg
  - term: membrillo
    category: condiment
    answer:
      core:
        - firm, sweet paste of quince, an apple-like fruit
      context:
        - Spanish; served with [[manchego]]
    details: >-
      Quince is hard and sour when raw; cooked down with sugar, it sets into a sliceable, jelly-like block. A slice on top
      of a slice of manchego is a classic Spanish snack.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Quince_cheese
    image: Manchego and membrillo.jpg
  - term: za’atar
    category: condiment
    answer:
      core:
        - a spice mix of dried thyme, sesame seeds and sumac, a tart red berry powder
      context:
        - Middle Eastern
    details: >-
      Za’atar is sprinkled on flatbread with olive oil (manakish), on [[labneh]], or over eggs and salads.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Za%27atar
    image: Zaʿtar.jpg
  - term: risotto
    category: dish
    answer:
      core:
        - creamy rice dish, slowly stirred with broth
      context:
        - northern Italian
    details: >-
      Short, starchy rice is cooked by adding hot broth a ladle at a time and stirring, which makes it creamy without any
      cream. Usually finished with butter and grated [[parmigiano reggiano]], and named for its main flavor, like risotto
      ai funghi (with mushrooms).
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Risotto
    image: Risotto parmagiana, Parma.jpg
  - term: polenta
    category: dish
    answer:
      core:
        - cornmeal porridge
      context:
        - northern Italian; soft, or set and grilled
    details: >-
      Coarse cornmeal simmered in water or broth until thick. Served soft and spoonable, often topped with melted cheese or
      a sauce, or left to set, then sliced and grilled or fried.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Polenta
    image: Polenta con salsicce.jpg
  - term: carbonara
    category: dish
    answer:
      core:
        - pasta with egg, [[pecorino romano]] and [[guanciale]]
      context:
        - Roman
    details: >-
      Egg yolks and grated cheese are tossed with hot pasta and crisp guanciale until they turn into a silky sauce; the Roman
      original has no cream. Usually made with [[spaghetti]] or [[rigatoni]].
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Carbonara
    image: Autentica Carbonara.jpg
  - term: tiramisu
    category: dessert
    answer:
      core:
        - layers of coffee-soaked sponge cookies and [[mascarpone]] cream, dusted with cocoa
      context:
        - Italian
    details: >-
      Italian for “pick me up”. Ladyfingers, light finger-shaped sponge cookies, are dipped in espresso and layered with mascarpone
      whipped with eggs and sugar, then chilled.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Tiramisu
    image: Classic Italian Tiramisu-3 (29989504485).jpg
  - term: cannoli
    category: dessert
    answer:
      core:
        - crisp fried pastry tubes filled with sweetened [[ricotta]]
      context:
        - from Sicily
    details: >-
      The singular is cannolo. The shells are filled just before serving so they stay crunchy; the ricotta filling often has
      chocolate chips or candied fruit, and the ends may be dipped in chopped pistachios.
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Cannoli
    image: Cannolo siciliano with chocolate squares.jpg
  - term: crudo (dish)
    category: dish
    answer:
      core:
        - thin slices of raw fish or seafood, dressed with oil and citrus
      context:
        - Italian
    details: >-
      Italian for raw; like carpaccio or sashimi, but dressed simply with olive oil, lemon and salt.
    compare:
      - carpaccio
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Crudo
    image: Wit & Wisdom - February 2024 - Sarah Stierch 09.jpg
