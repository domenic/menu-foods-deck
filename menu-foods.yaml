  - term: bel paese
    category: cheese
    answer:
      core:
        - semi-soft, mild, buttery cheese
      context:
        - Italian
    profile:
      rind: wax
      firmness: semi-soft
      texture: [creamy, melts well]
      strength: mild
      flavor: [milky, buttery]
      milk: [cow]
      age: aged 6 to 8 weeks
      origin: northern Italy
    details: >-
      The name means “beautiful country”: Italy. A smooth, gentle cheese first made in a factory in 1906, eaten as a snack
      or dessert cheese, or melted on pizza and sandwiches in place of [[mozzarella]].
    source:
      label: Wikipedia
      url: https://en.wikipedia.org/wiki/Bel_Paese_(cheese)
    image: Cheese_29_bg_051906.jpg
  - term: burrata
    category: cheese
    answer:
      core:
        - a pouch of fresh [[mozzarella]] filled with [[stracciatella (cheese)|stracciatella]]
    profile:
      family: stretched-curd
      rind: none
      firmness: soft
      texture: [creamy, high in fat]
      strength: mild
      flavor: [milky, buttery]
      milk: [cow]
      age: fresh
      origin: southern Italy
