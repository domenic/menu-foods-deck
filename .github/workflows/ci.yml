name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
          version: latest-known

      - name: Verify the release version
        if: github.ref_type == 'tag'
        run: |
          expected="v$(uv version --short)"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $expected"
            exit 1
          fi

      - name: Restore downloaded images
        uses: actions/cache@v6
        with:
          path: .cache/media
          key: media-${{ runner.os }}-${{ hashFiles('menu-foods.yaml') }}
          restore-keys: |
            media-${{ runner.os }}-

      - name: Lint and check formatting
        run: |
          uv run --locked ruff check
          uv run --locked ruff format --check

      - name: Run tests
        run: uv run --locked python -m unittest discover -s test -v

      - name: Set the package timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Build the deck
        run: uv run --locked python build_deck.py

      - name: Upload the deck
        uses: actions/upload-artifact@v7
        with:
          name: menu-foods-deck
          path: dist/menu-foods.apkg
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the deck
        uses: actions/download-artifact@v8
        with:
          name: menu-foods-deck
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are the annotated tag's message.
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)"
          notes="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .message)"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "dist/menu-foods.apkg" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            --verify-tag
